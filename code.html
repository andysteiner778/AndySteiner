      code: `/*
* Fiji / ImageJ batch processing macro for automated fluorescent cell counting.
* Walks an input folder recursively, segments each matching image, counts
* particles, and writes the processed image out as a TIFF.
*/
#@ File(label = "Input Folder", style = "directory") input
#@ File(label = "Output Folder", style = "directory") output
#@ String(label = "File suffix", value = ".nd2") suffix
#@ String(label = "Text to include", value = "") includeText

totalImages = 0;
processFolder(input);

function processFolder(input) {
	list = getFileList(input);
	list = Array.sort(list);
	for (i = 0; i < list.length; i++) {
		if (File.isDirectory(input + File.separator + list[i]))
			processFolder(input + File.separator + list[i]);
		else if (endsWith(list[i], suffix) && list[i].contains(includeText)) {
			processFile(input, output, list[i]);
			totalImages++;
		}
	}
}

function processFile(input, output, file) {
	run("Bio-Formats Importer", "open=[" + input + File.separator + file + "] color_mode=Default view=Hyperstack stack_order=XYCZT series_1 rois_import=[ROI manager]");
	run("Arrange Channels...", "new=1");
	run("Despeckle");
	run("Gaussian Blur...", "sigma=1");
	wait(100);
	run("Auto Threshold", "method=Otsu white");
	wait(100);
	run("Convert to Mask");
	run("Despeckle");
	run("Watershed");
	wait(100);
	run("Analyze Particles...", "size=15-2000 circularity=0.30-1.00 show=Outlines exclude summarize add composite");

	n = roiManager("count");
	getInfo("window.title");
	print(n);
	roiManager("reset");
	run("Clear Results");

	saveAs("Tiff", output + File.separator + file);
	close("\\\\s+.*", "slice");
	close("*");
}

close("ROI Manager");
waitForUser("Close all?", "Press OK");
close("log");
`

def build_vertex_labels():
    """Destrieux labels for every fsaverage5 vertex, both hemispheres concatenated.

    Returns (labels_concat, label_names). labels_concat[i] indexes label_names
    for vertex i, matching TRIBE's left-then-right vertex ordering.
    """
    from nilearn import datasets

    atlas = datasets.fetch_atlas_surf_destrieux()
    left = np.asarray(atlas["map_left"])
    right = np.asarray(atlas["map_right"])
    names = [n.decode() if isinstance(n, bytes) else str(n) for n in atlas["labels"]]

    # Right-hemisphere labels are offset so the two hemispheres stay separable.
    combined = np.concatenate([left, right + len(names)])
    combined_names = [f"L {n}" for n in names] + [f"R {n}" for n in names]
    return combined, combined_names

    than silently emitting a column of NaNs.
    """
    n_time, n_vert = preds.shape
    if len(vertex_labels) != n_vert:
        raise ValueError(
            f"Atlas has {len(vertex_labels)} vertices but predictions have {n_vert}. "
            "TRIBE should be on fsaverage5 (~20484). If this mismatches, the model "
            "output space changed and the region mapping below is meaningless."
        )

    timecourses, region_names = [], []
    for group_name, patterns in REGION_GROUPS:
        mask = np.zeros(n_vert, dtype=bool)
        for vi, li in enumerate(vertex_labels):
            name = label_names[li] if li < len(label_names) else ""
            if any(p in name for p in patterns):
                mask[vi] = True
        if mask.sum() == 0:
            print(f"  [warn] no vertices matched '{group_name}', skipping")
            continue
        timecourses.append(preds[:, mask].mean(axis=1))
        region_names.append(group_name)
        print(f"  {group_name}: {mask.sum()} vertices")

    return np.stack(timecourses, axis=1), region_names


def zscore_and_describe(timecourses, region_names, top_n=6):
    """Z-score each region against its own baseline and pull out the peaks.

    Z-scoring per region matters: raw predicted amplitudes differ a lot between
    regions, so without it early visual cortex dominates every comparison purely
    because its baseline is higher. What is interesting is deviation from a
    region's own resting level, not which region has the biggest number.
    """
    mu = timecourses.mean(axis=0, keepdims=True)
    sd = timecourses.std(axis=0, keepdims=True)
    sd[sd < 1e-8] = 1e-8
    z = (timecourses - mu) / sd

    events = []
    for ri, name in enumerate(region_names):
        peak_t = int(np.argmax(z[:, ri]))
        events.append({
            "region": name,
            "peak_time_s": peak_t,
            "peak_z": round(float(z[peak_t, ri]), 2),
            "trough_time_s": int(np.argmin(z[:, ri])),
            "trough_z": round(float(np.min(z[:, ri])), 2),
        })
    events.sort(key=lambda e: -e["peak_z"])
    return z, events[:top_n]


def summarize_for_llm(z, region_names, events, video_name, stride=2):
    """Compact text digest of the timecourse. Full 20k-vertex output will not fit
    in a context window, and dumping every second of every region wastes tokens
    on noise, so this sends a decimated z-scored table plus the ranked peaks."""
    lines = [
        f"Video: {video_name}",
        f"Duration: {z.shape[0]} seconds, sampled at 1 Hz",
        "",
        "Predicted response by region, z-scored within region "
        f"(every {stride}s):",
        "time_s," + ",".join(r.split(" (")[0] for r in region_names),
    ]
    for t in range(0, z.shape[0], stride):
        lines.append(f"{t}," + ",".join(f"{v:.2f}" for v in z[t]))

    lines += ["", "Strongest predicted peaks:"]
    for e in events:
        lines.append(
            f"  {e['region']}: peak z={e['peak_z']} at t={e['peak_time_s']}s, "
            f"low z={e['trough_z']} at t={e['trough_time_s']}s"
        )
    return "\\n".join(lines)

def render_brain_frames(preds, timepoints, outdir, prefix="brain"):
    """Render the predicted cortical map at each timepoint as a PNG.

    These are the actual surface plots TRIBE's output supports: predicted
    response painted onto an inflated fsaverage5 mesh. Both hemispheres, lateral
    view. Returns the list of paths written.

    All frames share one colour scale, computed once across every requested
    timepoint. Per-frame autoscaling would make a quiet moment and a peak moment
    look identical, which defeats the point of comparing them.
    """
    import matplotlib
    matplotlib.use("Agg")
    import matplotlib.pyplot as plt
    from nilearn import datasets, plotting

    fsaverage = datasets.fetch_surf_fsaverage("fsaverage5")
    n_left = 10242
    vmax = float(np.abs(preds[timepoints, :]).max())
    paths = []

    for t in timepoints:
        fig, axes = plt.subplots(1, 2, figsize=(11, 4.5),
                                 subplot_kw={"projection": "3d"})
        for ax, hemi, mesh, bg, sl in [
            (axes[0], "left", fsaverage.infl_left, fsaverage.sulc_left,
             slice(0, n_left)),
            (axes[1], "right", fsaverage.infl_right, fsaverage.sulc_right,
             slice(n_left, None)),
        ]:
            plotting.plot_surf_stat_map(
                mesh, preds[t, sl], hemi=hemi, view="lateral",
                bg_map=bg, colorbar=(hemi == "right"), vmax=vmax,
                axes=ax, figure=fig,
            )
            ax.set_title(f"{hemi} hemisphere", fontsize=9)

        fig.suptitle(f"TRIBE v2 predicted cortical response, t = {t}s\\n"
                     "Model prediction for an average subject, not measured fMRI",
                     fontsize=10)
        path = os.path.join(outdir, f"{prefix}_t{t:03d}.png")
        fig.savefig(path, dpi=110, bbox_inches="tight")
        plt.close(fig)
        paths.append(path)
        print(f"  rendered {path}")

    return paths


def call_gemini(digest, api_key, model_name="gemini-2.5-flash", image_paths=None):
    """Free-tier Gemini call, optionally multimodal.

    2.5 Flash is on the free tier, needs no billing account, and accepts images.
    Passing the rendered brain surfaces alongside the numbers lets the model
    comment on spatial pattern (how focal or widespread a predicted response is,
    whether it is bilateral) which the per-region averages throw away.

    Free-tier content is used to improve Google's products, so do not send
    anything sensitive through this.
    """
    try:
        from google import genai
        from google.genai import types
    except ImportError:
        print("google-genai not installed. Run: pip install google-genai")
        return None

    client = genai.Client(api_key=api_key)
    prompt = GEMINI_PROMPT.format(digest=digest)
    parts = [prompt]

    if image_paths:
        parts.append(
            "\\nAttached are predicted cortical surface maps at the timestamps "
            "named above, in order. Same colour scale across all of them, so "
            "brightness is comparable between frames. Comment on the spatial "
            "pattern as well as the timecourse: focal versus widespread, "
            "bilateral versus lateralised. If a map looks uniform or blank, say "
            "so, because that indicates a pipeline problem rather than a "
            "finding."
        )
        for p in image_paths:
            with open(p, "rb") as f:
                parts.append(types.Part.from_bytes(data=f.read(),
                                                   mime_type="image/png"))

    resp = client.models.generate_content(model=model_name, contents=parts)
    return resp.text

def verify(preds, timecourses, region_names):
    """Sanity checks. Run these before believing any output.

    The failure mode worth guarding against: an encoder silently returning
    constant or near-constant features, which yields a smooth, plausible-looking
    curve that is entirely an artifact. A prediction that never varies, or that
    is identical across unrelated regions, means the pipeline is broken even
    though the plot looks fine.
    """
    print("\\n--- verification ---")
    ok = True

    if preds.shape[1] not in (20484, 20480):
        print(f"  FAIL vertex count {preds.shape[1]}, expected ~20484 (fsaverage5)")
        ok = False
    else:
        print(f"  ok   vertex count {preds.shape[1]}")

    if not np.isfinite(preds).all():
        print("  FAIL predictions contain NaN or inf")
        ok = False
    else:
        print("  ok   all finite")

    var = timecourses.std(axis=0)
    dead = [region_names[i] for i, v in enumerate(var) if v < 1e-6]
    if dead:
        print(f"  FAIL flat timecourse (no variance) in: {dead}")
        ok = False
    else:
        print(f"  ok   all regions vary (min std {var.min():.4g})")

    # Near-identical regions mean the model is not differentiating, which is the
    # exact symptom of a feature extractor returning garbage.
    corr = np.corrcoef(timecourses.T)
    np.fill_diagonal(corr, 0)
    if corr.max() > 0.995:
        i, j = np.unravel_index(np.argmax(corr), corr.shape)
        print(f"  WARN '{region_names[i]}' and '{region_names[j]}' correlate at "
              f"{corr.max():.4f}, suspiciously identical")
    else:
        print(f"  ok   regions distinguishable (max off-diagonal r {corr.max():.3f})")

    print("--- " + ("all checks passed" if ok else "CHECKS FAILED, do not trust output"))
    return ok

class SpikerBoxBCIReader:
    """Manages real-time USB Serial streaming from Backyard Brains SpikerBox or synthetic signal generator."""

    def __init__(self, port=None, baud=DEFAULT_BAUD, force_sim=False):
        self.port = port
        self.baud = baud
        self.force_sim = force_sim
        self.is_simulated = False

        self.raw_buffer = deque(maxlen=BUFFER_SIZE)
        self.filtered_buffer = deque(maxlen=BUFFER_SIZE)
        for _ in range(BUFFER_SIZE):
            self.raw_buffer.append(0.0)
            self.filtered_buffer.append(0.0)

        self.running = False
        self.ser = None
        self.last_jump_time = 0.0
        self.threshold = DEFAULT_THRESHOLD
        self.sim_blink_trigger = False
        self.sim_blink_elapsed = 0.0

        self._init_connection()

    def _init_connection(self):
        # Simulation is opt-in only (--sim). Without it, this requires a real
        # Backyard Brains SpikerBox — no silent fallback to synthetic data.
        if self.force_sim:
            self.is_simulated = True
            print("[BCI Engine] Starting in SIMULATION mode (--sim requested).")
            return

        if not HAS_SERIAL:
            print("[BCI Engine] pyserial is not installed, and --sim was not specified.")
            print("[BCI Engine] This game requires a real SpikerBox connection. Install pyserial, or pass --sim to test without hardware.")
            sys.exit(1)

        # Auto-detect Backyard Brains SpikerBox if port is unspecified
        if not self.port:
            ports = serial.tools.list_ports.comports()
            for p in ports:
                if "USB" in p.description or "Arduino" in p.description or "FTDI" in p.description or "ttyUSB" in p.device:
                    self.port = p.device
                    break

        if not self.port:
            print("[BCI Engine] No SpikerBox hardware detected, and --sim was not specified.")
            print("[BCI Engine] Connect a Backyard Brains SpikerBox via USB, or pass --sim to test without hardware.")
            sys.exit(1)

        try:
            self.ser = serial.Serial(self.port, self.baud, timeout=0.1)
            self.is_simulated = False
            print(f"[BCI Engine] Hardware connected on {self.port} at {self.baud} baud.")
        except Exception as e:
            print(f"[BCI Engine] Could not open serial port {self.port}: {e}")
            print("[BCI Engine] This game requires a real SpikerBox connection. Pass --sim to test without hardware.")
            sys.exit(1)

    def start(self):
        self.running = True
        self.thread = threading.Thread(target=self._update_loop, daemon=True)
        self.thread.start()

    def stop(self):
        self.running = False

    def trigger_simulated_blink(self):
        """Simulates an EOG ocular blink artifact spike, time-locked to this call."""
        self.sim_blink_trigger = True
        self.sim_blink_elapsed = 0.0

    def _update_loop(self):
        t = 0.0
        dt = 1.0 / 250.0  # 250 Hz sampling rate

        while self.running:
            if self.is_simulated:
                # Synthetic EEG: 10 Hz Alpha wave + Gaussian noise + EOG Blink Spike
                base_eeg = 15.0 * math.sin(2 * math.pi * 10.0 * t) + random.gauss(0, 5.0)

                # EOG Blink artifact injection — time-locked to when the blink was
                # triggered (not to the free-running clock \`t\`), so the visible spike
                # always starts right at trigger time and lines up with the jump.
                blink_spike = 0.0
                if self.sim_blink_trigger:
                    blink_spike = 250.0 * math.exp(-(self.sim_blink_elapsed * 20)**2)
                    self.sim_blink_elapsed += dt
                    if self.sim_blink_elapsed > 0.2:
                        self.sim_blink_trigger = False

                val = base_eeg + blink_spike
                t += dt
                time.sleep(dt)
            else:
                # Real Backyard Brains SpikerBox Serial Byte Reader
                try:
                    if self.ser and self.ser.in_waiting > 0:
                        raw_line = self.ser.readline().decode('utf-8', errors='ignore').strip()
                        if raw_line and raw_line.lstrip('-').isdigit():
                            val = float(raw_line)
                        else:
                            continue
                    else:
                        time.sleep(0.002)
                        continue
                except Exception:
                    time.sleep(0.01)
                    continue

            # Process Signal
            self.raw_buffer.append(val)

            # Simple moving-average baseline removal
            recent = list(self.raw_buffer)[-20:]
            baseline = sum(recent) / len(recent) if recent else 0.0
            filtered_val = val - baseline
            self.filtered_buffer.append(filtered_val)

    def check_blink_jump(self):
        """Returns True if a recent EOG sample crosses threshold (isolating ocular blink artifact).

        The signal streams at ~250 Hz while the render loop calls this at 60 fps,
        so roughly four samples arrive between consecutive checks. Reading only
        filtered_buffer[-1] therefore sampled the blink at an arbitrary point on
        its decay curve and missed peaks that landed mid-frame. Scanning the whole
        window since the last check makes detection independent of frame timing.
        """
        current_time = time.time()
        if current_time - self.last_jump_time < BLINK_COOL_DOWN:
            return False

        if not self.filtered_buffer:
            return False
        n = min(len(self.filtered_buffer), SAMPLES_PER_CHECK)
        peak = max(abs(v) for v in list(self.filtered_buffer)[-n:])
        if peak >= self.threshold:
            self.last_jump_time = current_time
            return True
        return False

class Bird:

    def draw(self, surface):

        pygame.draw.circle(surface, (234, 179, 8), center, self.radius, width=2)
        # Eye
        eye_center = (int(self.x + 6), int(self.y - 4))
        pygame.draw.circle(surface, (255, 255, 255), eye_center, 5)
        pygame.draw.circle(surface, (0, 0, 0), eye_center, 2)

class Pipe:
    def __init__(self, x, speed=3.0, gap_size=150):
        self.x = x
        self.speed = speed
        self.gap_size = gap_size
        self.width = 60
        self.top_height = random.randint(100, SCREEN_HEIGHT - 220 - gap_size)
        self.bottom_y = self.top_height + self.gap_size
        self.passed = False

    def update(self):
        self.x -= self.speed

    def draw(self, surface):
        # Top Pipe
        top_rect = pygame.Rect(self.x, 0, self.width, self.top_height)
        pygame.draw.rect(surface, COLOR_PIPE, top_rect)
        pygame.draw.rect(surface, COLOR_PIPE_DARK, top_rect, width=3)
        pygame.draw.rect(surface, COLOR_PIPE_DARK, (self.x - 4, self.top_height - 20, self.width + 8, 20))

        # Bottom Pipe
        bottom_height = SCREEN_HEIGHT - self.bottom_y - 120  # Reserve bottom 120px for Oscilloscope HUD
        bottom_rect = pygame.Rect(self.x, self.bottom_y, self.width, bottom_height)
        pygame.draw.rect(surface, COLOR_PIPE, bottom_rect)
        pygame.draw.rect(surface, COLOR_PIPE_DARK, bottom_rect, width=3)
        pygame.draw.rect(surface, COLOR_PIPE_DARK, (self.x - 4, self.bottom_y, self.width + 8, 20))

    def collide(self, bird):
        if bird.y - bird.radius < self.top_height or bird.y + bird.radius > self.bottom_y:
            if bird.x + bird.radius > self.x and bird.x - bird.radius < self.x + self.width:
                return True
        return False

def slider_geometry():
    """Absolute pygame.Rect for the threshold slider track."""
    sx, sy, sw, sh = SLIDER_RECT
    return pygame.Rect(sx, SCREEN_HEIGHT - 120 + sy, sw, sh)


def slider_value_from_x(mouse_x):
    """Map an x pixel on the slider track to a threshold value."""
    track = slider_geometry()
    frac = (mouse_x - track.x) / float(track.width)
    frac = max(0.0, min(1.0, frac))
    return THRESHOLD_MIN + frac * (THRESHOLD_MAX - THRESHOLD_MIN)


def slider_knob_x(threshold):
    track = slider_geometry()
    frac = (threshold - THRESHOLD_MIN) / float(THRESHOLD_MAX - THRESHOLD_MIN)
    frac = max(0.0, min(1.0, frac))
    return int(track.x + frac * track.width)


def draw_threshold_slider(screen, font, threshold, dragging):
    track = slider_geometry()
    pygame.draw.rect(screen, (51, 65, 85), track, border_radius=4)

    # Filled portion up to the knob, so the current setting reads at a glance.
    knob_x = slider_knob_x(threshold)
    filled = pygame.Rect(track.x, track.y, max(0, knob_x - track.x), track.height)
    pygame.draw.rect(screen, COLOR_THRESH, filled, border_radius=4)

    radius = 9 if dragging else 7
    pygame.draw.circle(screen, COLOR_TEXT, (knob_x, track.centery), radius)
    pygame.draw.circle(screen, COLOR_THRESH, (knob_x, track.centery), radius, 2)

    label = font.render(f"BLINK THRESHOLD: {int(threshold)} uV", True, COLOR_TEXT)
    screen.blit(label, (track.x, track.y - 16))
    hint = font.render("drag / UP / DOWN", True, (100, 116, 139))
    screen.blit(hint, (track.right + 12, track.y - 4))


def do_jump(game_state, bird, pipes, score):
    """Single place where a jump/start/restart happens.

    Both trigger paths (a detected blink, or SPACE on real hardware) route
    through here, so they can never drift apart in behaviour.
    Returns the possibly-updated (game_state, bird, pipes, score).
    """
    if game_state == "PLAYING":
        bird.jump()
    else:  # START or GAMEOVER -> begin a fresh run
        game_state = "PLAYING"
        bird = Bird(150, SCREEN_HEIGHT // 2 - 50)
        pipes = [Pipe(SCREEN_WIDTH + 100)]
        score = 0
    return game_state, bird, pipes, score

def find_first_byte_with_marker(s, marker, timeout):
    st = time.monotonic(); bf = bytearray()
    while time.monotonic() - st < timeout:
        if s.in_waiting > 0:
            b = s.read(1)
            if not b: continue
            bf.append(b[0])
            if (b[0] & marker) == marker: return b[0], bf[:-1]
        else: time.sleep(0.00001)
    return None, bf

def read_and_parse_one_sample(s):
    b1, _ = find_first_byte_with_marker(s, MARKER_MASK, SYNC_TIMEOUT_S)
    if b1 is None: return None
    b2_c = s.read(1)
    if not b2_c: return None
    b2 = b2_c[0]
    if (b2 & MARKER_MASK) != 0: return None
    return ((b1 & VALUE_MASK_BYTE1) << 7) | b2

def apply_filters_to_chunk(chunk, zi_bp_in, zi_n_in):
    data = np.array(chunk, dtype=float)
    f_bp, zo_bp = sosfilt(sos_bandpass, data, zi=zi_bp_in)
    if ENABLE_NOTCH_FILTER and sos_notch is not None and zi_n_in is not None:
        f_fin, zo_n = sosfilt(sos_notch, f_bp, zi=zi_n_in)
    else:
        f_fin = f_bp; zo_n = zi_n_in
    return f_fin, zo_bp, zo_n

def suppress_blink_artifacts(sig, threshold=None, fs=None, pad_s=None):
    """Linearly interpolate across supra-threshold EOG deflections.

    Returns (cleaned_signal, n_samples_replaced). If nothing crosses threshold
    the input array is returned untouched. If the artifact swallows essentially
    the whole window there is nothing clean left to interpolate from, so the
    window is returned as-is and the caller can decide to drop it.
    """
    threshold = BLINK_REJECT_THRESHOLD if threshold is None else threshold
    fs = ESTIMATED_SAMPLING_RATE_HZ if fs is None else fs
    pad_s = BLINK_REJECT_PAD_S if pad_s is None else pad_s

    sig = np.asarray(sig, dtype=float)
    if sig.size < 3:
        return sig, 0

    # Median, not mean: a large blink drags the mean toward itself and would
    # partially hide the very deviation being measured.
    centre = np.median(sig)
    bad = np.abs(sig - centre) > threshold
    if not bad.any():
        return sig, 0

    # Widen each flagged run so the rising/falling shoulders of the blink, which
    # sit under the threshold but are still artifact, get replaced too.
    pad = max(1, int(fs * pad_s))
    idx = np.flatnonzero(bad)
    widened = np.zeros_like(bad)
    for i in idx:
        widened[max(0, i - pad):min(sig.size, i + pad + 1)] = True

    good = ~widened
    if good.sum() < max(3, int(0.2 * sig.size)):
        # Almost nothing survives; interpolating would invent the whole window.
        return sig, int(widened.sum())

    cleaned = sig.copy()
    cleaned[widened] = np.interp(np.flatnonzero(widened), np.flatnonzero(good), sig[good])
    return cleaned, int(widened.sum())


def extract_features_from_filtered(window):
    global print_debug, band_names, NUM_BANDS, ESTIMATED_SAMPLING_RATE_HZ, NYQUIST_FREQ, FEATURE_WINDOW_SIZE
    global NOTCH_FREQ_HZ, FILTER_HIGHCUT_HZ, FILTER_LOWCUT_HZ, ENABLE_NOTCH_FILTER, animation_frame_count

    # \`window\` may arrive as a list or as a numpy array (the blink-rejection path
    # returns an array), so length-check it explicitly rather than with \`not\`,
    # which is ambiguous for arrays.
    if window is None or len(window) < int(ESTIMATED_SAMPLING_RATE_HZ * 0.05):
        return None
    sig = np.array(window, dtype=float); sig = sig[~np.isnan(sig)]
    
    min_len_for_analysis = int(ESTIMATED_SAMPLING_RATE_HZ * 0.1) 
    if len(sig) < min_len_for_analysis:
        return None
    
    N = len(sig)
    N_welch_nperseg = N 
    
    if N_welch_nperseg < 4:
        return None

    lg_upper = (NOTCH_FREQ_HZ - 5) if ENABLE_NOTCH_FILTER else min(55, FILTER_HIGHCUT_HZ - 1)
    hg_lower = (NOTCH_FREQ_HZ + 5) if ENABLE_NOTCH_FILTER else min(65, FILTER_HIGHCUT_HZ - 1)
    hg_upper = FILTER_HIGHCUT_HZ
    if hg_lower >= hg_upper:
        hg_lower = hg_upper - min(5, hg_upper-0.1)
        if hg_lower < ( (NOTCH_FREQ_HZ + 5) if ENABLE_NOTCH_FILTER else 65 ):
             hg_lower = (NOTCH_FREQ_HZ + 5) if ENABLE_NOTCH_FILTER else 65
        if hg_lower >= hg_upper:
             hg_lower = hg_upper

    bands_def = {
        'Delta': (0.5, 4), 'Theta': (4, 8), 'Alpha': (8, 13), 'Beta': (13, 30),
        'LowGamma': (30, lg_upper),
        'HighGamma': (hg_lower, hg_upper)
    }

    try:
        freqs, psd = welch(sig, fs=ESTIMATED_SAMPLING_RATE_HZ, nperseg=N_welch_nperseg,
                           nfft=N_welch_nperseg, 
                           scaling='density', noverlap=N_welch_nperseg // 2)
    except ValueError:
        return None

    powers = []
    df = freqs[1] - freqs[0] if len(freqs) > 1 else 1.0 

    for name in band_names:
        if name not in bands_def: powers.append(-12.0); continue
        low, high = bands_def[name]
        
        if high <= low or high > NYQUIST_FREQ + 1 or low < 0 : 
            powers.append(-12.0)
            continue
        
        idx = np.where((freqs >= low) & (freqs <= high))[0]
        if len(idx) > 0:
            p = np.sum(psd[idx]) * df 
            powers.append(np.log10(p) if p > 1e-12 else -12.0)
        else:
            powers.append(-12.0)
    
    if len(powers) != NUM_BANDS:
        return None

    var = np.var(sig); mean = np.mean(sig)
    fv = np.array(powers + [mean, np.log10(var) if var > 1e-9 else -9.0])
    
    if np.any(np.isnan(fv)) or np.any(np.isinf(fv)):
        return None
    return fv

def check_for_spike_and_trigger_key(new_filtered_samples):
    """Scan EVERY filtered sample produced since the last animation frame.

    Previously this took a single scalar (the last sample of the frame), so the
    baseline deque filled at one value per *frame* instead of one per *sample*:
    the 50%-full arming condition needed 5760 frames (~5 minutes at 20 fps) and
    the resulting "1 second baseline" was really a multi-minute, 20 Hz-decimated
    sketch of the signal. Everything that peaked between frame boundaries -- i.e.
    almost every blink, since the serial stream runs ~576x faster than the plot
    redraws -- was invisible to the detector.

    Now the whole per-frame chunk goes in, so SPIKE_BASELINE_WINDOW_SAMPLES
    really is SPIKE_BASELINE_WINDOW_S seconds of signal and arming takes ~0.5 s.
    """
    global last_spike_time, keyboard_controller, spike_detection_baseline_buffer, ENABLE_AUTO_SPIKE_DETECTION
    global SPIKE_THRESHOLD_STD_FACTOR, SPIKE_REFRACTORY_PERIOD_S, MIN_ABSOLUTE_SPIKE_AMPLITUDE, animation_frame_count
    global spike_event_count, spike_indicator_frames_left, print_debug

    if not ENABLE_AUTO_SPIKE_DETECTION or keyboard_controller is None:
        return

    chunk = np.asarray(new_filtered_samples, dtype=float)
    chunk = chunk[~np.isnan(chunk)]
    if chunk.size == 0:
        return

    # Baseline is the *preceding* signal, computed before this chunk is folded in,
    # so a large blink can't inflate the very statistics meant to detect it.
    baseline_data = np.array(spike_detection_baseline_buffer, dtype=float)
    spike_detection_baseline_buffer.extend(chunk.tolist())

    if baseline_data.size < SPIKE_BASELINE_WINDOW_SAMPLES * SPIKE_BASELINE_MIN_FILL_FRACTION:
        return

    current_time = time.monotonic()
    if (current_time - last_spike_time) < SPIKE_REFRACTORY_PERIOD_S:
        return

    baseline_mean = np.mean(baseline_data)
    baseline_std = np.std(baseline_data)

    if baseline_std < 1e-2 : baseline_std = 1e-2

    threshold_value_std_component = SPIKE_THRESHOLD_STD_FACTOR * baseline_std
    threshold_value = baseline_mean + threshold_value_std_component
    effective_min_abs_spike = max(MIN_ABSOLUTE_SPIKE_AMPLITUDE, 2.5 * baseline_std)

    # Vectorised per-sample test over the whole chunk (was: one scalar per frame).
    heights = chunk - baseline_mean
    crossings = np.nonzero((chunk > threshold_value) & (heights > effective_min_abs_spike))[0]

    if print_debug:
        peak_val = float(np.max(chunk))
        print(f"SpikeDet Check: n={chunk.size}, PeakVal={peak_val:.2f}, Mean={baseline_mean:.2f}, STD={baseline_std:.2f}, "
              f"Thresh={threshold_value:.2f} (Factor*STD: {threshold_value_std_component:.2f}), "
              f"MinAbsHeightReq={effective_min_abs_spike:.2f}, "
              f"ActualHeight={(peak_val - baseline_mean):.2f}")

    if crossings.size > 0:
        idx = int(crossings[0])
        current_eeg_value = float(chunk[idx])
        # Sub-frame timing: how far into this chunk the crossing actually happened.
        spike_time = current_time - (chunk.size - 1 - idx) / ESTIMATED_SAMPLING_RATE_HZ
        timestamp_event = datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S.%f")[:-3]
        print(f"--- AUTO-SPIKE DETECTED at {timestamp_event}! Val: {current_eeg_value:.2f} > Thresh: {threshold_value:.2f} ---")

        print(">>> ATTEMPTING TO PRESS SPACEBAR! Ensure game window is ACTIVE & FOCUSED! <<<")
        try:
            keyboard_controller.press(Key.space)
            time.sleep(0.05)
            keyboard_controller.release(Key.space)
            print("--- Spacebar Press/Release command sent by pynput. Check game! ---")
            last_spike_time = spike_time
            spike_event_count += 1
            spike_indicator_frames_left = SPIKE_INDICATOR_FRAMES
        except Exception as e:
            print(f"!!! ERROR trying to simulate spacebar press: {e} !!!")

def update_plots(frame):
    global serial_read_buffer, filtered_data_buffer, feature_vectors_buffer, pca_results_buffer, tsne_results_buffer, band_power_history

    animation_frame_count += 1

        max_s = int(ESTIMATED_SAMPLING_RATE_HZ * (ani_interval_ms / 1000.0)) + int(ESTIMATED_SAMPLING_RATE_HZ * 0.05)
        for _ in range(max_s):
            s = read_and_parse_one_sample(ser)
            if s is not None: new_raw_samples.append(s)
            elif ser.in_waiting < PACKET_SIZE : break
    
    if new_raw_samples: serial_read_buffer.extend(new_raw_samples)

    processed_filtered_this_frame = []
    min_chunk = int(ESTIMATED_SAMPLING_RATE_HZ / 60)
    while len(serial_read_buffer) >= min_chunk:
        chunk = [serial_read_buffer.popleft() for _ in range(min_chunk)]
        if not chunk: break
        f_chunk, next_zi_bp, next_zi_n = apply_filters_to_chunk(chunk, current_zi_bandpass, current_zi_notch)
        current_zi_bandpass, current_zi_notch = next_zi_bp, next_zi_n
        processed_filtered_this_frame.extend(f_chunk)

    updated_artists = []

    if processed_filtered_this_frame:
        filtered_data_buffer.extend(processed_filtered_this_frame)
        line_filtered.set_ydata(list(filtered_data_buffer)) 
        updated_artists.append(line_filtered)

        if ENABLE_AUTO_SPIKE_DETECTION and processed_filtered_this_frame:
             # Pass EVERY sample filtered this frame, not just the last one.
             check_for_spike_and_trigger_key(processed_filtered_this_frame)

        raw_samples_since_last_feature += len(processed_filtered_this_frame)
        ctime = time.monotonic()
        if ctime - last_ylim_update_time > 0.5:
            valid_data = [v for v in filtered_data_buffer if not np.isnan(v)]
            if len(valid_data) > FILTERED_DATA_BUFFER_SIZE * 0.05:
                dmin, dmax = np.min(valid_data), np.max(valid_data)
                dr = dmax - dmin if dmax - dmin > 0.2 else 0.2
                pad = dr * 0.15
                ax_raw.set_ylim(dmin - pad, dmax + pad)
                dynamic_ylim_text_raw.set_text(f'Ylim: [{dmin-pad:.2f}, {dmax+pad:.2f}]')
            last_ylim_update_time = ctime

    if raw_samples_since_last_feature >= FEATURE_UPDATE_INTERVAL_SAMPLES:
        raw_samples_since_last_feature = 0
        window_for_features = list(filtered_data_buffer)[-FEATURE_WINDOW_SIZE:]
        valid_points_in_window = [p for p in window_for_features if not np.isnan(p)]
        if len(valid_points_in_window) > FEATURE_WINDOW_SIZE * 0.8:
            # Clean EOG artifacts out of the *features* only. The raw panel above
            # still plots the untouched signal, so blinks stay visible there while
            # the band powers, PCA and t-SNE stop being driven by them.
            drop_window = False
            if ENABLE_BLINK_REJECTION:
                cleaned, n_rejected = suppress_blink_artifacts(valid_points_in_window)
                if n_rejected:
                    blink_samples_rejected += n_rejected
                    if n_rejected > BLINK_MAX_INTERP_FRACTION * len(valid_points_in_window):
                        drop_window = True
                        blink_windows_dropped += 1
                valid_points_in_window = cleaned
            features = None if drop_window else extract_features_from_filtered(valid_points_in_window)
            if features is not None and len(features) == (NUM_BANDS + 2):
                band_power_history.append(features[:NUM_BANDS])
                if band_lines[0] not in updated_artists : updated_artists.extend(band_lines)

                if not has_fitted_scaler:
                    features_for_fitting_scaler.append(features)
                    if len(features_for_fitting_scaler) >= MIN_FEATURES_FOR_INITIAL_FIT:
                        scaler.fit(np.array(features_for_fitting_scaler)); has_fitted_scaler = True
                        print("Scaler fitted."); features_for_fitting_scaler = []
                
                if has_fitted_scaler and not has_fitted_ipca:
                    scaled_f = scaler.transform(features.reshape(1, -1))
                    features_for_fitting_ipca.append(scaled_f.flatten())
                    if len(features_for_fitting_ipca) >= MIN_FEATURES_FOR_INITIAL_FIT:
                        ipca.partial_fit(np.array(features_for_fitting_ipca)); has_fitted_ipca = True
                        print("IPCA fitted."); features_for_fitting_ipca = []
                
                if has_fitted_scaler and has_fitted_ipca:
                    scaled_f = scaler.transform(features.reshape(1, -1))
                    feature_vectors_buffer.append(scaled_f.flatten())
                    pca_transformed = ipca.partial_fit(scaled_f).transform(scaled_f)[0]
                    pca_results_buffer.append(tuple(pca_transformed) if N_PCA_COMPONENTS >=2 else pca_transformed[0])
                    if pca_scatter not in updated_artists: updated_artists.append(pca_scatter)
                    
                    ctime = time.monotonic()
                    if ctime - last_tsne_update_time > TSNE_UPDATE_INTERVAL_SECONDS:
                        if len(feature_vectors_buffer) >= max(MIN_FEATURES_FOR_INITIAL_FIT, tsne_model.perplexity + 5) :
                            current_features_for_tsne = np.array(list(feature_vectors_buffer))[-TSNE_MAX_POINTS:]
                            try:
                                tsne_embedding = tsne_model.fit_transform(current_features_for_tsne)
                                tsne_data_to_plot_cache = tsne_embedding
                            except Exception as e: print(f"t-SNE error: {e}")
                        last_tsne_update_time = ctime
    
    bp_data = np.array(list(band_power_history)).T 
    if bp_data.ndim == 2 and bp_data.shape[0] == NUM_BANDS and bp_data.shape[1] > 0:
        x_band_plot = np.arange(bp_data.shape[1])
        for i, line in enumerate(band_lines):
            line.set_data(x_band_plot, bp_data[i,:])
        ax_bands.set_xlim(0, bp_data.shape[1] -1 if bp_data.shape[1]>1 else 1)
        all_finite_powers = bp_data[np.isfinite(bp_data)]
        if all_finite_powers.size > 0:
            min_pow, max_pow = np.min(all_finite_powers), np.max(all_finite_powers)
            if max_pow - min_pow < 1.0:
                 mid_pow = (max_pow + min_pow) / 2
                 min_pow, max_pow = mid_pow - 2.5, mid_pow + 2.5
            ax_bands.set_ylim(min_pow - 0.5, max_pow + 0.5)
        else: ax_bands.set_ylim(-12, 5)

    if has_fitted_ipca and len(pca_results_buffer) > 0:
        pca_data_np = np.array(list(pca_results_buffer))
        valid_pca = pca_data_np[~np.isnan(pca_data_np).any(axis=1)]
        if valid_pca.shape[0] > 0:
            pca_scatter.set_offsets(valid_pca[:, :N_PCA_COMPONENTS])
            pca_scatter.set_array(np.arange(valid_pca.shape[0]))
            if animation_frame_count % 10 == 0: update_scatter_plot_limits(ax_pca, valid_pca, dynamic_ylim_text_pca, "PCA")

    if tsne_data_to_plot_cache.shape[0] > 0:
        valid_tsne = tsne_data_to_plot_cache[~np.isnan(tsne_data_to_plot_cache).any(axis=1)]
        if valid_tsne.shape[0] > 0:
            tsne_scatter.set_offsets(valid_tsne)
            tsne_scatter.set_array(np.arange(valid_tsne.shape[0]))
            if animation_frame_count % 10 == 0: update_scatter_plot_limits(ax_tsne, valid_tsne, dynamic_ylim_text_tsne, "tSNE")
            if tsne_scatter not in updated_artists: updated_artists.append(tsne_scatter)

    if ENABLE_BLINK_REJECTION:
        blink_reject_text.set_text(
            f"Blink rejection ON  (thr {BLINK_REJECT_THRESHOLD:.0f}, "
            f"{blink_samples_rejected} samples interpolated, "
            f"{blink_windows_dropped} windows dropped)")
    else:
        blink_reject_text.set_text("Blink rejection OFF  (EOG artifacts feed the features)")
    if blink_reject_text not in updated_artists:
        updated_artists.append(blink_reject_text)

    if spike_indicator_frames_left > 0:
        spike_indicator_text.set_text(f"BLINK SPIKE #{spike_event_count}  ->  SPACEBAR SENT")
        spike_indicator_frames_left -= 1
    elif spike_indicator_text.get_text():
        spike_indicator_text.set_text('')
    if spike_indicator_text not in updated_artists: updated_artists.append(spike_indicator_text)

    return updated_artists

def update_scatter_plot_limits(ax, data, text_artist, plot_name):
    if data.shape[0] < 2: return
    min_d0, max_d0 = np.min(data[:,0]), np.max(data[:,0])
    min_d1, max_d1 = np.min(data[:,1]), np.max(data[:,1])
    range_d0 = max_d0 - min_d0; range_d1 = max_d1 - min_d1
    p0 = range_d0 * 0.1 if range_d0 > 0.01 else 0.1
    p1 = range_d1 * 0.1 if range_d1 > 0.01 else 0.1
    ax.set_xlim(min_d0 - p0, max_d0 + p0); ax.set_ylim(min_d1 - p1, max_d1 + p1)
    text_artist.set_text(f'X:[{min_d0-p0:.1f},{max_d0+p0:.1f}] Y:[{min_d1-p1:.1f},{max_d1+p1:.1f}]')

def build_control_panel():
    """Small separate window: blink-rejection on/off plus its threshold slider."""
    from matplotlib.widgets import CheckButtons, Slider

    ctrl_fig = plt.figure("EEG Dashboard Controls", figsize=(5.2, 2.0))
    ctrl_fig.subplots_adjust(left=0.30, right=0.95, top=0.85, bottom=0.30)

    ax_check = ctrl_fig.add_axes([0.03, 0.55, 0.24, 0.32])
    ax_check.set_frame_on(False)
    check = CheckButtons(ax_check, ['Blink rejection'], [ENABLE_BLINK_REJECTION])

    ax_slider = ctrl_fig.add_axes([0.33, 0.30, 0.60, 0.14])
    slider = Slider(ax_slider, 'Reject above', 10.0, 250.0,
                    valinit=BLINK_REJECT_THRESHOLD, valstep=5.0)

    ctrl_fig.text(0.03, 0.10,
                  "Lower = more aggressive. Raw trace is never modified;\\n"
                  "only the features feeding band power / PCA / t-SNE are cleaned.",
                  fontsize=7.5, va='bottom')

    def on_check(_label):
        globals()['ENABLE_BLINK_REJECTION'] = not ENABLE_BLINK_REJECTION
        print(f"Blink rejection {'ON' if ENABLE_BLINK_REJECTION else 'OFF'}")

    def on_slide(val):
        globals()['BLINK_REJECT_THRESHOLD'] = float(val)

    check.on_clicked(on_check)
    slider.on_changed(on_slide)
    return ctrl_fig, check, slider


def main():
    """Connect to the SpikerBox and run the live 4-panel dashboard."""
    global keyboard_controller, ENABLE_AUTO_SPIKE_DETECTION

    import argparse
    parser = argparse.ArgumentParser(description="Live EEG Signal Analysis Dashboard")
    parser.add_argument('--port', default=SERIAL_PORT,
                        help=f'Serial port for the SpikerBox (default: {SERIAL_PORT}, '
                             'or set the EEG_SERIAL_PORT env var)')
    parser.add_argument('--auto-spike', action='store_true',
                        help='Enable the blink-spike detector that presses spacebar '
                             '(the trigger that drives EEG Flappy Bird)')
    parser.add_argument('--debug', action='store_true',

import os, subprocess
from pathlib import Path

try:
    from mcp.server.fastmcp import FastMCP
except ImportError:

WORKSPACE = Path(os.environ["AGENT_BRIDGE_WORKSPACE"]).resolve()
CLAUDE_BIN = os.environ["AGENT_BRIDGE_CLAUDE"]
AGY_BIN = os.environ["AGENT_BRIDGE_AGY"]
TIMEOUT_SECONDS = 1800
MAX_OUTPUT_CHARS = 40000

mcp = FastMCP("agent-bridge")


def _argv(binary, args):
    # Windows CreateProcess cannot exec .cmd/.bat; route those through cmd.exe.
    if binary.lower().endswith((".cmd", ".bat")):
        return ["cmd.exe", "/c", binary] + args
    return [binary] + args


def _run(binary, args, prompt):
    if not WORKSPACE.is_dir():
        return "ERROR: workspace {} does not exist".format(WORKSPACE)
    try:
        proc = subprocess.run(
            _argv(binary, args),
            capture_output=True,
            text=True,
            encoding="utf-8",   # cp1252 default crashes on non-ASCII output
            errors="replace",
            cwd=str(WORKSPACE),
            timeout=TIMEOUT_SECONDS,
            shell=False,        # no shell interpolation, ever
        )
    except subprocess.TimeoutExpired:
        return "ERROR: timed out after {}s".format(TIMEOUT_SECONDS)
    except FileNotFoundError:
        return "ERROR: {} not found".format(binary)
    except Exception as exc:
        return "ERROR: {}: {}".format(type(exc).__name__, exc)

    out = proc.stdout or ""
    err = proc.stderr or ""
    if err:
        out += "\\n[stderr]\\n" + err
    if len(out) > MAX_OUTPUT_CHARS:
        out = out[:MAX_OUTPUT_CHARS] + "\\n[TRUNCATED]"

    # Both CLIs can exit 0 having done nothing. Treat that as failure.
    if "auto-denied" in err or "no output produced" in err:
        return "FAILED (permission auto-denied; exit code was {})\\n{}".format(
            proc.returncode, out)
    if proc.returncode == 0 and not proc.stdout.strip():
        return "FAILED (exit 0 but no stdout)\\n{}".format(out)

    return "exit={}\\n{}".format(proc.returncode, out)


@mcp.tool()
def dispatch_claude_code(prompt: str) -> str:
    """Run a task in Claude Code (Fable 5) headlessly in the project workspace.
    Use for anything that can size a position, send an order, or compute a
    number those decisions depend on."""
    if not prompt.strip():
        return "ERROR: empty prompt"
    return _run(CLAUDE_BIN, [
        "--model", "claude-fable-5",
        "--add-dir", str(WORKSPACE),
        "--allowedTools", "Read", "Write", "Edit", "Glob", "Grep",
        "Bash(python:*)", "Bash(pytest:*)", "Bash(git status)", "Bash(git diff:*)",
        "-p", prompt,
    ], prompt)

    Use for exchange adapters, logging, dashboards, fixtures, scripts, docs."""
    if not prompt.strip():

        "--effort", "high",
        "--add-dir", str(WORKSPACE),
        "--print-timeout", "25m",
        "--dangerously-skip-permissions",

def check_keystore_signature():
    """Verify if the application is running against a standard debug keystore when in production mode.
    Raises RuntimeError if a debug keystore is detected in production.
    """
    if ENVIRONMENT_MODE != "production":
        return
    try:
        from jnius import autoclass
        context = autoclass('org.flet.client.FletActivity').getCurrentActivity()
        package_manager = context.getPackageManager()
        package_name = context.getPackageName()
        package_info = package_manager.getPackageInfo(package_name, 64)  # 64 = GET_SIGNATURES
        signatures = package_info.signatures
        
        CertificateFactory = autoclass('java.security.cert.CertificateFactory')
        cf = CertificateFactory.getInstance('X.509')
        ByteArrayInputStream = autoclass('java.io.ByteArrayInputStream')
        input_stream = ByteArrayInputStream(signatures[0].toByteArray())
        cert = cf.generateCertificate(input_stream)
        
        dn = cert.getSubjectDN().getName()
        if "Android Debug" in dn or "O=Android" in dn or "debug.keystore" in dn:
            raise RuntimeError("PRODUCTION ERROR: Cannot run production builds signed with standard Android debug keystores!")
    except ImportError:
        # Not on Android or jnius not installed
        pass

def check_device_security() -> bool:
    """Check for root or jailbreak signatures."""
    paths = [
        "/system/app/Superuser.apk",
        "/sbin/su",
        "/system/bin/su",
        "/system/xbin/su",
        "/data/local/xbin/su",
        "/data/local/bin/su",

        "/system/bin/failsafe/su",
        "/data/local/su",

        "/Applications/Cydia.app",
        "/Library/MobileSubstrate/MobileSubstrate.dylib",
        "/bin/bash",
        "/usr/sbin/sshd",
        "/etc/apt",
    ]
    for p in paths:
        try:

                return True
        except Exception:

    try:
        if os.name != "nt":

            res = subprocess.run(["which", "su"], stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=2)

# SSL/TLS Handshake Interception & Pinning
import ssl
import hashlib

_original_wrap_socket = ssl.SSLContext.wrap_socket

def _pinned_wrap_socket(self, sock, server_hostname=None, *args, **kwargs):
    ssock = _original_wrap_socket(self, sock, server_hostname=server_hostname, *args, **kwargs)
    if server_hostname:
        host_lower = server_hostname.lower()
        matched_pins = None
        for key, pins in PINNED_FINGERPRINTS.items():
            if key in host_lower:
                matched_pins = pins
                break
        if matched_pins:
            try:
                cert_der = ssock.getpeercert(binary_form=True)
                if not cert_der:
                    raise ssl.SSLError("No certificate presented by peer")
                sha256 = hashlib.sha256(cert_der).hexdigest()
                if sha256 not in matched_pins:
                    import logging
                    logging.getLogger("config").critical(
                        "SSL PINNING FAILURE: Host %s fingerprint %s does not match pinned fingerprints!",
                        server_hostname, sha256
                    )
                    import os
                    os._exit(1)
            except Exception as e:
                import logging
                logging.getLogger("config").critical("SSL PINNING ERROR: %s", e)
                import os
                os._exit(1)
    return ssock

ssl.SSLContext.wrap_socket = _pinned_wrap_socket


# ---------------------------------------------------------------------------
# Production Pre-Flight Sanity Checker
#
# Validates that a production boot is actually wired to live endpoints and
# that no sandbox/mock material leaked into the production configuration.
# Never runs at import time — engine.enforce_production_preflight() and the
# app boot sequence orchestrate it (secrets hydrate from the Supabase vault
# only after sign-in, so credential checks are opt-in via require_credentials).
# ---------------------------------------------------------------------------
import socket
from dataclasses import dataclass, field as _dc_field

# Affix-anchored markers only: bare "test"/"mock" substrings would randomly
# flag valid production keys (Supabase anon keys are base64 JWTs, Plaid
# production secrets are hex-ish), so we match prefixes/suffixes and the
# unambiguous "sandbox" word instead.
SANDBOX_MARKERS: tuple[str, ...] = (
    "sandbox", "sim-", "mock-", "-mock", "test-", "-test", "demo-", "fake-",
)


@dataclass
class PreflightResult:
    ok: bool
    failures: list[str] = _dc_field(default_factory=list)
    checks_run: list[str] = _dc_field(default_factory=list)


def _marker_hits(name: str, value: str) -> list[str]:
    """Sandbox-marker scan for one config value. Empty values never flag —
    the vault may simply not be hydrated yet."""
    if not value:
        return []
    low = value.lower()
    return [
        f"{name} contains sandbox/mock marker '{marker}'"
        for marker in SANDBOX_MARKERS
        if marker in low
    ]


def _check_supabase_config() -> list[str]:
    # Supabase creds come from .env (not the vault) so they are always required.
    failures = []
    url = SUPABASE_URL
    if not url:
        failures.append("SUPABASE_URL is empty in production")
    else:
        if not url.startswith("https://"):
            failures.append(f"SUPABASE_URL is not https: {url.split('://')[0]}://…")
        from urllib.parse import urlparse
        host = urlparse(url).hostname or ""
        if not host.endswith(".supabase.co"):
            failures.append("SUPABASE_URL host is not a *.supabase.co domain")
        failures.extend(_marker_hits("SUPABASE_URL", url))
    if not SUPABASE_ANON_KEY:
        failures.append("SUPABASE_ANON_KEY is empty in production")
    elif SUPABASE_ANON_KEY.startswith("sb_secret_") or "service_role" in SUPABASE_ANON_KEY:
        # secret-class keys bypass row-level security — a client bundling one
        # hands out full database access
        failures.append(
            "SUPABASE_ANON_KEY is a SECRET-class key (sb_secret_/service_role)"
            " — use the publishable client key")
    return failures


def _check_plaid_config(require_credentials: bool) -> list[str]:
    failures = []
    client_id = os.getenv("PLAID_CLIENT_ID", "")
    if require_credentials:
        if not PLAID_SECRET:
            failures.append("PLAID_SECRET is empty in production")
        if not client_id:
            failures.append("PLAID_CLIENT_ID is empty in production")
    if PLAID_SECRET.lower().startswith("access-sandbox-"):
        failures.append("PLAID_SECRET is a Plaid sandbox access token")
    failures.extend(_marker_hits("PLAID_SECRET", PLAID_SECRET))
    failures.extend(_marker_hits("PLAID_CLIENT_ID", client_id))
    return failures


def _check_dwolla_config(require_credentials: bool) -> list[str]:
    failures = []
    client_key = os.getenv("DWOLLA_CLIENT_KEY", "")
    if require_credentials:
        if not DWOLLA_CLIENT_SECRET:
            failures.append("DWOLLA_CLIENT_SECRET is empty in production")
        if not client_key:
            failures.append("DWOLLA_CLIENT_KEY is empty in production")
    failures.extend(_marker_hits("DWOLLA_CLIENT_SECRET", DWOLLA_CLIENT_SECRET))
    failures.extend(_marker_hits("DWOLLA_CLIENT_KEY", client_key))
    return failures


def _check_live_endpoints() -> list[str]:
    """Assert plaid_service's import-time environment state agrees with
    production mode. PLAID_ENV/DWOLLA_ENV freeze when plaid_service is first
    imported; if they disagree with ENVIRONMENT_MODE the process is
    misconfigured (stale module state) and must not move money."""
    import plaid_service  # lazy: config is already in sys.modules, no cycle
    failures = []
    if plaid_service.PLAID_ENV != "production":
        failures.append(
            f"Plaid endpoint environment is '{plaid_service.PLAID_ENV}', not 'production'")
    if plaid_service.DWOLLA_ENV != "production":
        failures.append(
            f"Dwolla endpoint environment is '{plaid_service.DWOLLA_ENV}', not 'production'")
    url = plaid_service.dwolla_api_url()
    if url != "https://api.dwolla.com" or "sandbox" in url:
        failures.append(f"Dwolla API URL is not the live endpoint: {url}")
    return failures


def _preflight_probe_hosts() -> list[str]:
    hosts = ["production.plaid.com", "api.dwolla.com"]
    if SUPABASE_URL:
        from urllib.parse import urlparse
        host = urlparse(SUPABASE_URL).hostname
        if host:
            hosts.append(host)
    return hosts


def _probe_tls_handshake(host: str, port: int = 443, timeout: float = 5.0):
    """Live TLS handshake probe against a pinned host.

    Returns a failure string on a genuine certificate problem (handshake
    rejection or fingerprint-pin mismatch) and None otherwise. Plain
    connectivity errors (timeout/DNS/refused/offline) return None by design:
    ACH is impossible offline anyway and the runtime pinning wrapper still
    guards every real request.

    Deliberately bypasses the _pinned_wrap_socket monkeypatch — routing the
    probe through ssl.SSLContext.wrap_socket would os._exit(1) on mismatch,
    which is exactly the silent death this preflight exists to prevent.
    """
    try:
        with socket.create_connection((host, port), timeout=timeout) as sock:
            ctx = ssl.create_default_context()
            with _original_wrap_socket(ctx, sock, server_hostname=host) as ssock:
                cert_der = ssock.getpeercert(binary_form=True)
        if not cert_der:
            return f"TLS handshake failure for {host}: no certificate presented"
        matched_pins = None
        host_lower = host.lower()
        for key, pins in PINNED_FINGERPRINTS.items():
            if key in host_lower:
                matched_pins = pins
                break
        if matched_pins is not None:
            sha256 = hashlib.sha256(cert_der).hexdigest()
            if sha256 not in matched_pins:
                return (f"TLS handshake/pin failure for {host}: certificate "
                        f"fingerprint {sha256[:16]}… does not match pinned fingerprints")
        return None
    except (ssl.SSLError, ssl.CertificateError) as exc:
        return f"TLS handshake/pin failure for {host}: {exc}"
    except (socket.timeout, socket.gaierror, ConnectionRefusedError, OSError):
        return None  # connectivity, not a certificate failure


def run_production_preflight(include_network: bool = True,
                             require_credentials: bool = False) -> PreflightResult:
    """Pre-flight sanity checker for production boots.

    No-op (ok=True) outside production mode. In production, validates
    Supabase/Plaid/Dwolla configuration shape, live endpoint wiring, and —
    when include_network is set — performs live TLS handshake probes against
    the pinned hosts. Set require_credentials=True after the vault has
    hydrated secrets (post sign-in); before that, empty secrets are legal.
    """
    # Module-global lookup at call time so tests can patch config.ENVIRONMENT_MODE
    mode = globals().get("ENVIRONMENT_MODE", "sandbox")
    if str(mode).lower() != "production":
        return PreflightResult(ok=True, checks_run=["environment-mode-short-circuit"])

    failures: list[str] = []
    checks_run: list[str] = []

    for name, check in (
        ("supabase-config", lambda: _check_supabase_config()),
        ("plaid-config", lambda: _check_plaid_config(require_credentials)),
        ("dwolla-config", lambda: _check_dwolla_config(require_credentials)),
        ("live-endpoints", lambda: _check_live_endpoints()),
    ):
        checks_run.append(name)
        try:
            failures.extend(check())
        except Exception as exc:  # malformed config must lock, not crash
            failures.append(f"pre-flight check '{name}' raised: {exc}")

    if include_network:
        checks_run.append("tls-handshake-probes")
        for probe_host in _preflight_probe_hosts():
            try:
                # module-global lookup so tests can patch config._probe_tls_handshake
                failure = _probe_tls_handshake(probe_host)
            except Exception as exc:
                failure = f"TLS probe for {probe_host} raised: {exc}"
            if failure:
                failures.append(failure)

    return PreflightResult(ok=not failures, failures=failures, checks_run=checks_run)

from pydantic import BaseModel, field_validator, model_validator


class BankDeal(BaseModel):

    account_type: Literal["checking", "savings", "business_checking", "other"]
    min_deposit: int | None = None  # None if not stated

    monthly_fee: int               # whole dollars, 0 if no fee
    fee_waiver_terms: str          # fine print on how the monthly fee is avoided
    fee_waivable_at_zero_balance: bool  # True if no fee or waivable without parking a balance
    direct_deposit_required: bool
    early_closure_window_days: int | None = None  # clawback window; None if unstated
    url: str
    available_states: str = ""     # comma-separated 2-letter codes; "" = nationwide
    hard_pull: bool = False        # True only if opening triggers a hard credit inquiry
    monthly_maintenance_fee: float = 0   # recurring maintenance fee in dollars; 0 if none
    min_balance_to_waive_fee: float = 0  # balance that waives the monthly fee; 0 if N/A
    outgoing_ach_fee: float = 0          # fee the bank charges per outgoing ACH transfer; 0 if free

    # New taxonomy & grounding fields
    promotion_type: Literal["lump_sum", "recurring_spend", "unsupported"] = "lump_sum"
    monthly_reward: int = 0
    monthly_spend_requirement: int = 0
    reward_months_cap: int = 0     # 0 = uncapped/unstated
    offer_expiration_date: str = ""  # YYYY-MM-DD
    bonus_evidence: str = ""       # verbatim sentence justifying bonus_amount or monthly_reward
    requirement_evidence: str = "" # verbatim sentence for deposit/spend/DD requirements

    # Eligibility (extracted from the block and, when available, the bank's T&C)
    eligibility_type: Literal[
        "open", "geographic", "employer", "military", "affinity", "membership"
    ] = "open"
    county_restrictions: str = ""      # counties required/excluded (esp. credit unions)
    membership_requirements: str = ""  # employer/school/association/affinity terms
    residency_terms: str = ""          # verbatim residency rules from the fine print

    @field_validator("offer_expiration_date")
    @classmethod
    def validate_expiration_date(cls, v: str) -> str:
        if v == "":
            return v
        try:
            from datetime import date
            date.fromisoformat(v)
        except ValueError:
            raise ValueError("offer_expiration_date must be empty or in YYYY-MM-DD format")
        return v

    @model_validator(mode="after")
    def validate_deal(self) -> "BankDeal":
        if self.promotion_type == "lump_sum":
            if self.bonus_amount <= 0:
                raise ValueError("lump_sum promotion requires bonus_amount > 0")
            if not self.bonus_evidence:
                raise ValueError("lump_sum promotion requires non-empty bonus_evidence")
        elif self.promotion_type == "recurring_spend":
            if self.monthly_reward <= 0:
                raise ValueError("recurring_spend promotion requires monthly_reward > 0")
            if not self.bonus_evidence:
                raise ValueError("recurring_spend promotion requires non-empty bonus_evidence")
            self.bonus_amount = 0
        else:  # unsupported shapes never carry an actionable bonus figure
            self.bonus_amount = 0

        # Sane ranges
        if self.bonus_amount > 5000:
            raise ValueError("bonus_amount cannot exceed 5000")
        if self.holding_period_days is not None and self.holding_period_days > 365:
            raise ValueError("holding_period_days cannot exceed 365")
        if self.early_closure_window_days is not None and self.early_closure_window_days > 365:
            raise ValueError("early_closure_window_days cannot exceed 365")

        return self

def fetch_page(url: str = TARGET_URL) -> str:
    resp = requests.get(url, headers={"User-Agent": USER_AGENT}, timeout=30)
    resp.raise_for_status()
    return resp.text


def extract_deal_blocks(html: str) -> list[str]:
    """Pull one text block per deal from the DoC page.

    Page structure: h2 section headers ("Best Checking Account Bonuses", ...),
    one h3 per deal, then p/ul siblings holding the fine print until the next
    heading. Each block = section + deal title + fine print + offer link.
    """
    soup = BeautifulSoup(html, "html.parser")
    content = soup.find(class_="entry-content") or soup
    blocks: list[str] = []
    section = ""
    for heading in content.find_all(["h2", "h3"]):
        title = " ".join(heading.get_text(" ", strip=True).split())
        if heading.name == "h2":
            section = title
            continue
        if "$" not in title:
            continue  # not a bonus listing (FAQ, methodology, etc.)
        parts = [f"SECTION: {section}", f"DEAL: {title}"]
        # link priority: DoC's canonical "Direct link to offer" anchor beats
        # everything; otherwise prefer an offsite (bank) link over internal
        # doctorofcredit.com pages; otherwise keep the first http link found
        link = ""
        link_final = False
        node = heading.find_next_sibling()
        while node is not None and node.name not in ("h2", "h3"):
            text = " ".join(node.get_text(" ", strip=True).split())
            if text:
                parts.append(text)
            if not link_final and hasattr(node, "find_all"):
                for a in node.find_all("a", href=True):
                    href = a["href"]
                    if not href.startswith("http"):
                        continue
                    a_text = a.get_text(" ", strip=True).lower()
                    if "direct link" in a_text or "apply" in a_text:
                        link, link_final = href, True
                        break
                    if not link:
                        link = href
                    elif ("doctorofcredit.com" in link
                          and "doctorofcredit.com" not in href):
                        link = href
            node = node.find_next_sibling()
        if link:
            parts.append(f"LINK: {link}")
        blocks.append("\\\\n".join(parts))
    return blocks


def block_hash(block: str) -> str:
    return hashlib.sha256(block.encode("utf-8")).hexdigest()

# Canonical field keys the portal engine knows how to fill. Gemini must map an
# ambiguous form field to exactly one of these (or "sensitive"/"unknown").
FIELD_CLASSIFY_KEYS = (
    "first", "last", "full", "email", "phone", "dob",
    "address", "city", "state", "zip", "sensitive", "unknown",
)

FIELD_CLASSIFY_PROMPT = """You label web-form input fields for an autofill engine.
Given a JSON array of fields (each has an "idx" and text metadata: label, name,
id, placeholder, type), return a JSON object mapping the idx (as a string) to
exactly one canonical key:

Rules:
- Use "sensitive" for SSN/ITIN/tax id, passwords, PINs, security codes, full
  account/routing numbers, or ID-document fields — anything that must never be
  autofilled without the user's explicit consent.
- Use "unknown" when you cannot confidently tell what the field is.
- "first"/"last"/"full" are the applicant's name; "dob" is date of birth.
- Only the field metadata is provided — never any user values. Map by meaning.

Fields:
{fields}

def classify_fields_with_gemini(fields: list[dict]) -> dict[str, str]:
    """Map ambiguous form fields to canonical keys via Gemini.

    \\\`\\\`fields\\\`\\\` is a list of metadata dicts (idx + label/name/id/placeholder/type)
    — NO user values are ever sent. Returns {idx_str: canonical_key}. Best-effort:
    any failure (missing key, quota, bad JSON) returns {} so the caller falls
    back to heuristics only.
    """
    if not fields:
        return {}
    import json
    try:
        from google import genai
        client = genai.Client(api_key=config.GEMINI_API_KEY)
        prompt = FIELD_CLASSIFY_PROMPT.format(
            keys=", ".join(FIELD_CLASSIFY_KEYS),
            fields=json.dumps(fields, ensure_ascii=False),
        )
        resp = client.models.generate_content(
            model=GEMINI_MODEL,
            contents=prompt,
            config={"response_mime_type": "application/json",
                    "temperature": 0.0},
        )
        raw = json.loads(resp.text)
    except Exception as exc:
        log.warning("field classify failed (%s); heuristics only", exc)
        return {}
    out: dict[str, str] = {}
    if isinstance(raw, dict):
        for k, v in raw.items():
            if isinstance(v, str) and v in FIELD_CLASSIFY_KEYS:
                out[str(k)] = v
    return out

  limited to (e.g. "CA,IL"); empty string if nationwide or unstated.

  empty string if open.

{text}

_TC_KEYS = ("available_states", "eligibility_type", "county_restrictions",
            "membership_requirements", "residency_terms")


def _terms_text(html: str, limit: int = 15000) -> str:
    """Visible text of a T&C page, collapsed and truncated to bound tokens."""
    soup = BeautifulSoup(html, "html.parser")
    for tag in soup(["script", "style", "noscript"]):
        tag.decompose()
    return " ".join(soup.get_text(" ", strip=True).split())[:limit]


def fetch_and_parse_terms(url: str) -> dict | None:
    """Fetch a bank offer's official page and extract eligibility rules via
    Gemini. Cached by URL in \\\`\\\`terms_cache\\\`\\\` (re-parses only when the page
    HTML changes). Best-effort: returns None on any fetch/parse failure or for
    URLs that point back at the aggregator itself.
    """
    if not url or not url.startswith("http") or "doctorofcredit.com" in url:
        return None
    try:
        html = fetch_page(url)
    except Exception as exc:
        log.info("T&C fetch skipped for %s (%s)", url, exc)
        return None
    html_hash = hashlib.sha256(html.encode("utf-8", "replace")).hexdigest()
    cached = database.get_cached_terms(url)
    if cached is not None and cached["html_hash"] == html_hash and cached["parsed_json"]:
        try:
            return json.loads(cached["parsed_json"])
        except Exception:
            pass  # fall through and re-parse
    try:
        from google import genai
        client = genai.Client(api_key=config.GEMINI_API_KEY)
        resp = client.models.generate_content(
            model=GEMINI_MODEL,
            contents=TERMS_PROMPT.format(text=_terms_text(html)),
            config={"response_mime_type": "application/json", "temperature": 0.0},
        )
        data = json.loads(resp.text)
    except Exception as exc:
        log.warning("T&C parse failed for %s (%s)", url, exc)
        return None
    if not isinstance(data, dict):
        return None
    data = {k: data.get(k, "") for k in _TC_KEYS}
    database.set_cached_terms(url, html_hash, json.dumps(data))
    return data


def _state_set(csv: str) -> set[str]:
    return {s.strip().upper() for s in (csv or "").split(",") if s.strip()}


def reconcile_eligibility(deal, tc: dict) -> dict:
    """Cross-reference the aggregator-derived deal against the bank T&C parse.

    The bank's own T&C is authoritative for geography, so a restriction found
    there is applied to the deal (the safe direction — never widens
    availability). Fills county/membership/residency when the aggregator block
    was silent, and returns the verification metadata for insert_deal.
    """
    doc_states = _state_set(deal.available_states)
    tc_states = _state_set(tc.get("available_states", ""))

    if tc_states:
        merged = (doc_states & tc_states) or tc_states  # prefer the stricter set
        deal.available_states = ",".join(sorted(merged))

    if tc.get("eligibility_type") in (
            "open", "geographic", "employer", "military", "affinity", "membership"):
        # T&C wins unless it only says "open" while the block found a restriction
        if not (tc["eligibility_type"] == "open" and deal.eligibility_type != "open"):
            deal.eligibility_type = tc["eligibility_type"]
    for field in ("county_restrictions", "membership_requirements", "residency_terms"):
        if not getattr(deal, field) and tc.get(field):
            setattr(deal, field, tc[field])

    # confidence: how well the two sources agree on geography
    if not tc_states:
        # T&C made no geographic claim — rely on the aggregator's states
        conf = 1.0 if not doc_states else 0.7
    elif doc_states == tc_states:
        conf = 1.0
    elif doc_states & tc_states:
        conf = 0.6
    else:
        conf = 0.4  # sources disagree — trusted the stricter T&C above
    return {
        "tc_source_url": deal.url,
        "tc_fetched_at": date.today().isoformat(),
        "tc_verified": True,
        "eligibility_confidence": conf,
    }


def backfill_eligibility(cu_only: bool = True, limit: int | None = None) -> dict:
    """Populate eligibility metadata on ALREADY-scraped deals by fetching each
    bank's official page and cross-referencing its T&C.

    Deals ingested before the double-source feature carry no county/membership
    data, so nothing to filter on. This walks active deals and backfills them.
    \\\`\\\`cu_only\\\`\\\` keeps it quota-frugal by checking only credit unions (the deals
    that actually carry county/membership limits). Returns run counts.
    """
    from types import SimpleNamespace
    deals = database.get_active_deals()
    stats = {"checked": 0, "updated": 0, "skipped": 0}
    for row in deals:
        url = row["url"] or ""
        if not url.startswith("http") or "doctorofcredit.com" in url:
            stats["skipped"] += 1
            continue
        name = row["bank_name"].lower()
        is_cu = any(w in name for w in
                    ("credit union", "fcu", "federal credit", " cu"))
        if cu_only and not is_cu:
            stats["skipped"] += 1
            continue
        try:
            tc = fetch_and_parse_terms(url)
        except Exception as exc:
            log.warning("backfill T&C failed for %s: %s", row["bank_name"], exc)
            tc = None
        stats["checked"] += 1
        if not tc:
            continue
        d = SimpleNamespace(
            url=url,
            available_states=row["available_states"] or "",
            eligibility_type=row["eligibility_type"] or "open",
            county_restrictions=row["county_restrictions"] or "",
            membership_requirements=row["membership_requirements"] or "",
            residency_terms=row["residency_terms"] or "")
        meta = reconcile_eligibility(d, tc)
        database.update_deal_eligibility(row["id"], d, meta)
        stats["updated"] += 1
        if limit and stats["updated"] >= limit:
            break
        time.sleep(1)  # gentle on the free-tier Gemini quota
    return stats

            # a stale bank login is user-fixable — surface it instead of
            # quietly booking a simulated transfer that never settles

                f"{from_label}: bank login expired — re-authenticate via Plaid",
                context=from_label) from exc
        if posted:
            # ACH already fired: simulating now would book the money twice.
            # The intent stays 'initiated'; the boot sweeper reconciles it
            # against Dwolla by correlation id.
            raise
        log.warning("ach_transfer failed or Dwolla not ready; falling back to local simulation: %s", exc)
        return simulate_ach_transfer(amount, from_label, to_label, fee=fee)

def create_link_token(user_id: str) -> str:
    """Create a Link token to start the Plaid Link flow for this user.
    Requests the 'auth' product (account/routing verification, required for
    processor tokens); Balance needs no entry in the products array — it is
    implicitly available on every Plaid item."""

    from plaid.model.link_token_create_request import LinkTokenCreateRequest
    from plaid.model.link_token_create_request_user import (
        LinkTokenCreateRequestUser,
    )
    from plaid.model.products import Products

    env_mode = getattr(config, "ENVIRONMENT_MODE", "sandbox").lower()
    kwargs = {}
    if env_mode != "sandbox":
        from plaid.model.link_token_create_request_auth import LinkTokenCreateRequestAuth
        kwargs["auth"] = LinkTokenCreateRequestAuth(
            instant_microdeposits_enabled=True,
            automated_microdeposits_enabled=True,

        language="en",

    return response["link_token"]

def exchange_public_token(public_token: str,
                          want_processor: bool | None = None) -> dict:
    """Swap the public token from a completed Link flow for a permanent
    access token, and (when Dwolla is in play) mint a Dwolla processor token
    for the item's first depository account. Returns {'access_token',
    'item_id', 'account_id', 'processor_token'} — store access_token/item_id
    on the my_accounts row (plaid_access_token / plaid_item_id) and feed
    processor_token to ensure_funding_source().

    Minting the processor token requires the Plaid account to be enabled for
    the Dwolla integration in the Plaid dashboard; when it isn't (or Dwolla
    isn't configured) processor_token comes back '' and downstream transfers
    fall back to local simulation. Linking itself never fails on this account.
    """
    from plaid.model.item_public_token_exchange_request import (
        ItemPublicTokenExchangeRequest,
    )

    response = _client().item_public_token_exchange(
        ItemPublicTokenExchangeRequest(public_token=public_token)
    )
    access_token = response["access_token"]
    account_id = _first_depository_account_id(access_token)
    if want_processor is None:
        want_processor = dwolla_configured()
    processor_token = ""
    if want_processor:
        try:
            processor_token = create_processor_token(access_token, account_id)
        except Exception as exc:  # e.g. keys not enabled for Dwolla — non-fatal
            log.warning("Dwolla processor token unavailable "
                        "(transfers stay simulated): %s", exc)
    return {
        "access_token": access_token,
        "item_id": response["item_id"],
        "account_id": account_id,
        "processor_token": processor_token,

def refresh_account_balances(accounts,
                             needs_reauth: dict[int, bool] | None = None
                             ) -> dict[int, float]:
    """Live sandbox balances, keyed by account id, for rows that carry a
    plaid_access_token. One dead token must not kill the whole scan, so
    per-account failures are logged and skipped; returns {} when Plaid isn't
    configured at all. Pass a dict as needs_reauth to learn which account ids
    failed with ITEM_LOGIN_REQUIRED (caller persists the flag)."""
    out: dict[int, float] = {}
    try:
        if not plaid_configured():
            return out
        for acct in accounts:
            token = acct["plaid_access_token"]

            try:

            except Exception as exc:

                            acct["id"], exc)

                    needs_reauth[acct["id"]] = True
    except Exception as exc:
        log.warning("refresh_account_balances failed: %s", exc)
    return out


def verify_deposit_status(access_token: str, target_amount: float) -> bool:
    """True if a credit of at least target_amount hit the linked account in
    the last 30 days (e.g. the signup bonus or a qualifying direct deposit).
    Plaid reports money leaving the account as positive, deposits as negative.
    Pages through the full window — busy accounts exceed one response page."""
    from plaid.model.transactions_get_request import TransactionsGetRequest
    from plaid.model.transactions_get_request_options import (
        TransactionsGetRequestOptions,
    )

    client = _client()
    request = TransactionsGetRequest(
        access_token=access_token,
        start_date=date.today() - timedelta(days=30),
        end_date=date.today(),
        options=TransactionsGetRequestOptions(count=500),
    )
    response = client.transactions_get(request)
    txns = list(response["transactions"])
    while len(txns) < response["total_transactions"]:
        request.options.offset = len(txns)
        response = client.transactions_get(request)
        txns.extend(response["transactions"])
    return any(-txn["amount"] >= target_amount for txn in txns)

    ]

    filtered = []
    for txn in dict_txns:

        category_str = " - ".join(category)

def reconcile_transfer_intents():
    """Boot recovery sweeper: query Dwolla for every intent stuck in
    'initiated' and hand each verdict to engine's reconciler, which applies it
    atomically (intent CAS + ledger row in one transaction). Intents unknown
    to the server keep an engine.INTENT_TIMEOUT_MINUTES grace window before
    being failed — a slow receipt is deferred to the next sweep, not declared
    dead and later fought over by the offline sync queue."""
    import database
    import engine
    intents = database.get_initiated_transfer_intents()
    if not intents:
        return

    try:
        token = _dwolla_token()
    except Exception as exc:
        log.warning("Could not initialize Dwolla token for recovery: %s", exc)
        return

    for intent in intents:
        corr_id = intent["correlation_id"]
        try:
            resp = token.get("transfers", {"correlationId": corr_id})
            transfers = resp.body.get("_embedded", {}).get("transfers", [])
            decision = engine.classify_intent(
                intent, transfers[0] if transfers else None)
            engine.apply_intent_resolution(intent, decision)
        except Exception as exc:
            log.warning("Failed to reconcile transfer intent %s: %s", corr_id, exc)

      aria: el.getAttribute("aria-label") || "",
      autocomplete: el.getAttribute("autocomplete") || "",

      empty: !el.value, required: !!el.required

    var blob = [meta.name, meta.id, meta.label, meta.placeholder, meta.aria, meta.autocomplete].join(" ");

# Fill by data-ac-idx; keeps the deny-list guard so a mis-map can't write a

FILL_JS = """
(function () {
  var fills = %s;
  Object.keys(fills).forEach(function (idx) {
    var el = document.querySelector('[data-ac-idx="' + idx + '"]');
    if (!el || el.type === "password" || el.type === "hidden") return;

    el.value = fills[idx];

        """Return (fills{idx->value}, unknowns[meta], sensitive[meta])."""
        fills: dict[str, str] = {}

        sensitive: list[dict] = []

            if key:

                if not key or key == "unknown":
                    continue
                if key == "sensitive":
                    sensitive.append(u)
                    continue
                val = _value_for_key(profile, key)
                if val and u.get("empty", True):
                    fills[str(u["idx"])] = val

        self._log(f"Filled {len(fills)} field(s) on this page")
        await self._handle_roadblocks(data, sensitive)
