import base64
import json

import requests

import config

_TIMEOUT = 20

# Human-readable reason for the most recent sync failure (shown in the
# status-icon tooltip); '' when the last pass succeeded.
LAST_SYNC_ERROR = ""

MISSING_TABLE_HINT = ("Cloud tables missing — run the setup SQL in your "
                      "Supabase dashboard (see CLOUD_SETUP.sql)")


class MissingCloudTable(RuntimeError):
    """The Supabase project lacks a table this sync needs (PGRST205)."""


def is_missing_table_error(exc) -> bool:
    s = str(exc)
    return isinstance(exc, MissingCloudTable) or "PGRST205" in s \\
        or "Could not find the table" in s


def _base() -> tuple[str, dict]:
    url = config.SUPABASE_URL.rstrip("/")
    key = config.SUPABASE_ANON_KEY
    if not url or not key:
        raise RuntimeError(
            "Cloud backup not configured: set SUPABASE_URL and "
            "SUPABASE_ANON_KEY in .env")
    return url, {"apikey": key, "Content-Type": "application/json"}


def _auth_error(resp) -> str:
    try:
        body = resp.json()
        return body.get("msg") or body.get("error_description") \\
            or body.get("message") or resp.text[:120]
    except Exception:
        return resp.text[:120]


def sign_up(email: str, password: str) -> dict | None:
    """Create an account. Returns a session dict, or None when the project
    requires email confirmation first (tell the user to check their inbox)."""
    url, headers = _base()
    resp = requests.post(f"{url}/auth/v1/signup", headers=headers,
                         json={"email": email, "password": password},
                         timeout=_TIMEOUT)
    if resp.status_code >= 400:
        raise RuntimeError(_auth_error(resp))
    body = resp.json()
    if not body.get("access_token"):
        return None  # confirmation email flow
    return {"access_token": body["access_token"],
            "refresh_token": body["refresh_token"],
            "user": body.get("user", {})}


def sign_in(email: str, password: str) -> dict:
    url, headers = _base()
    resp = requests.post(f"{url}/auth/v1/token?grant_type=password",
                         headers=headers,
                         json={"email": email, "password": password},
                         timeout=_TIMEOUT)
    if resp.status_code >= 400:
        raise RuntimeError(_auth_error(resp))
    body = resp.json()
    return {"access_token": body["access_token"],
            "refresh_token": body["refresh_token"],
            "user": body.get("user", {})}


def refresh_session(refresh_token: str) -> dict:
    url, headers = _base()
    resp = requests.post(f"{url}/auth/v1/token?grant_type=refresh_token",
                         headers=headers,
                         json={"refresh_token": refresh_token},
                         timeout=_TIMEOUT)
    if resp.status_code >= 400:
        raise RuntimeError("Session expired — sign in again")
    body = resp.json()
    return {"access_token": body["access_token"],
            "refresh_token": body["refresh_token"],
            "user": body.get("user", {})}


import platform
import hashlib

def get_device_fingerprint() -> str:
    """Generate a unique fingerprint for the current device."""
    try:
        parts = [
            platform.node() or "unknown_host",
            platform.system() or "unknown_os",
            platform.machine() or "unknown_arch"
        ]
        raw = "-".join(parts)
        return hashlib.sha256(raw.encode("utf-8")).hexdigest()[:16]
    except Exception:
        return "fallback-device-fingerprint"


def user_id_from_token(access_token: str) -> str:
    """The uid lives in the JWT payload (middle segment, base64url)."""
    seg = access_token.split(".")[1]
    seg += "=" * (-len(seg) % 4)
    return json.loads(base64.urlsafe_b64decode(seg))["sub"]


_user_id = user_id_from_token  # internal callers below predate the public name


def backup(access_token: str, payload_json: str) -> None:
    """Upsert this user's single backup row with the full DB snapshot."""
    url, headers = _base()
    headers["Authorization"] = f"Bearer {access_token}"
    headers["Prefer"] = "resolution=merge-duplicates"
    resp = requests.post(
        f"{url}/rest/v1/churn_backups?on_conflict=user_id",
        headers=headers,
        json=[{"user_id": _user_id(access_token),
               "payload": json.loads(payload_json),
               "updated_at": "now()"}],
        timeout=_TIMEOUT,
    )
    if resp.status_code >= 400:
        raise RuntimeError(_auth_error(resp))


def restore_latest(access_token: str) -> tuple[str, str] | None:
    """(payload_json, updated_at) of this user's backup, or None if none."""
    url, headers = _base()
    headers["Authorization"] = f"Bearer {access_token}"
    resp = requests.get(
        f"{url}/rest/v1/churn_backups?select=payload,updated_at&limit=1",
        headers=headers, timeout=_TIMEOUT,
    )
    if resp.status_code >= 400:
        raise RuntimeError(_auth_error(resp))
    rows = resp.json()
    if not rows:
        return None
    return json.dumps(rows[0]["payload"]), rows[0]["updated_at"]


def fetch_vault(access_token: str) -> dict | None:
    """Fetch the user's secure vault row from \`user_secure_vault\` table."""

# ---------- offline sync queue (single pass; app.py loops this) ----------

async def process_sync_queue_once(token: str) -> bool:
    """Drain the offline_sync_queue in strict FIFO order.

    Each item is claimed with a compare-and-swap (pending -> processing) so a
    concurrent runner can never double-process it; items someone else claimed
    are skipped. The first failure re-queues its item, bumps retry_count, and
    stops the pass (returns False) so later items can't jump the queue.
    'transfer_receipt' items replay a delayed ACH receipt through
    engine.reconcile_receipt — the receipt counts as server evidence, so it can
    override an intent the boot sweeper declared failed, exactly once.
    """
    global LAST_SYNC_ERROR
    import asyncio
    import logging

    import database
    import engine

    log = logging.getLogger(__name__)
    pending = await asyncio.to_thread(database.get_pending_sync_queue)
    for item in pending:
        qid = item["id"]
        action_type = item["action_type"]
        payload = json.loads(item["payload_json"])
        claimed = await asyncio.to_thread(database.claim_sync_queue_item, qid)
        if not claimed:
            continue  # another runner owns it
        try:
            if action_type == "backup":
                await asyncio.to_thread(backup, token, payload["payload_json"])
            elif action_type == "update_vault":
                await asyncio.to_thread(
                    update_vault, token,
                    payload["gemini_key"],
                    payload["plaid_secret"],
                    payload["dwolla_secret"])
            elif action_type == "transfer_receipt":
                if payload.get("transfer_id"):  # a receipt with no id proves nothing
                    receipt = {"id": payload["transfer_id"],
                               "status": payload.get("status", "pending")}
                    await asyncio.to_thread(
                        engine.reconcile_receipt,
                        payload["correlation_id"], receipt)
            await asyncio.to_thread(database.delete_from_sync_queue, qid)
            log.info("Offline Sync: item %d synced successfully", qid)
        except Exception as exc:
            LAST_SYNC_ERROR = (MISSING_TABLE_HINT
                               if is_missing_table_error(exc) else str(exc))
            log.warning("Offline Sync: item %d sync failed: %s", qid, exc)
            await asyncio.to_thread(database.update_sync_queue_status, qid, "pending")
            await asyncio.to_thread(database.increment_sync_queue_retry, qid)
            return False
    LAST_SYNC_ERROR = ""
    return True


def hydrate_local_db_from_cloud(access_token: str) -> None:
    """Download user's complete dataset from Supabase remote tables and merge into SQLite.
    
    Guarantees network isolation by fetching all remote tables into memory before triggering
    the local SQLite database hydration merge.
    """
    url, headers = _base()
    headers["Authorization"] = f"Bearer {access_token}"

    import logging
    _log = logging.getLogger(__name__)

    def _fetch(table: str) -> list[dict]:
        resp = requests.get(f"{url}/rest/v1/{table}", headers=headers,
                            timeout=_TIMEOUT)
        if resp.status_code >= 400:
            if "PGRST205" in resp.text:
                # missing mirror table: hydrate what exists instead of aborting
                _log.warning("cloud table %s missing — skipped (%s)",
                             table, MISSING_TABLE_HINT)
                return []
            raise RuntimeError(f"Failed to fetch {table}: {_auth_error(resp)}")
        return resp.json()

    my_accounts = _fetch("my_accounts")
    bonus_milestones = _fetch("bonus_milestones")
    fee_waivers = _fetch("fee_waivers")
    tax_ledgers = _fetch("tax_ledgers")
    
    # Merge atomically into SQLite
    import database
    database.hydrate_local_data(my_accounts, bonus_milestones, fee_waivers, tax_ledgers)
    
    # Record sync log
    records_transferred = len(my_accounts) + len(bonus_milestones) + len(fee_waivers) + len(tax_ledgers)
    fingerprint = get_device_fingerprint()
    database.log_device_sync(fingerprint, "success", records_transferred)


def parse_utc_timestamp(ts_str):
    from datetime import datetime, timezone
    import re
    if not ts_str:
        return datetime.min.replace(tzinfo=timezone.utc)
    ts_str = str(ts_str).replace("Z", "+00:00")
    if "T" not in ts_str and " " in ts_str:
        if "+" not in ts_str and "-" not in ts_str[10:]:
            ts_str += "+00:00"
    try:
        dt = datetime.fromisoformat(ts_str)
    except ValueError:
        try:
            cleaned = re.sub(r'[^0-9\\-:\\s\\.]', '', ts_str).strip()
            dt = datetime.strptime(cleaned.split('.')[0], "%Y-%m-%d %H:%M:%S")
        except ValueError:
            return datetime.min.replace(tzinfo=timezone.utc)
    if dt.tzinfo is None:
        dt = dt.replace(tzinfo=timezone.utc)
    return dt.astimezone(timezone.utc)

def calculate_metrics(deposit: float, bonus: float, days: float, hysa_rate: float) -> dict:
    """
    Calculates churning opportunity cost and APY.
    Handles boundary/division-by-zero cases gracefully.
    """
    # Opportunity Cost formula: Deposit * (HYSA_Rate / 100) * (Days / 365)
    opp_cost = deposit * (hysa_rate / 100.0) * (days / 365.0)
    
    # Net Churn Profit: Bonus - Opportunity Cost
    net_profit = bonus - opp_cost
    
    # Equivalent Annualized APY: (Bonus / Deposit) * (365 / Days) * 100
    if deposit > 0 and days > 0:
        equiv_apy = (bonus / deposit) * (365.0 / days) * 100.0
    else:
        equiv_apy = 0.0
        
    return {
        "opp_cost": opp_cost,
        "net_profit": net_profit,
        "equiv_apy": equiv_apy
    }

- integrity = HMAC-SHA256(mac_key, "tag"||nonce||ciphertext), checked before decrypt
- stored token = "enc2:" + urlsafe_b64(nonce(16) || tag(32) || ciphertext)

v1 tokens ("enc1:", single key for both roles, written by vaults created at
200k iterations) remain readable; the app transparently re-encrypts them on
the first successful unlock.

The salt, KDF iteration count, and a key verifier (HMAC of a fixed string)
live in app_settings so a wrong PIN is rejected up front instead of yielding
garbage plaintext.
"""
import base64
import hashlib
import hmac
import os

class TamperError(ValueError):
    """MAC/integrity verification failed: the ciphertext was modified, or the
    key material doesn't match. Subclasses ValueError so existing handlers
    keep working; security-sensitive callers catch this first and trigger
    engine.security_purge()."""


PBKDF2_ITERATIONS = 600_000   # current OWASP guidance for PBKDF2-HMAC-SHA256
LEGACY_ITERATIONS = 200_000   # vaults created before the v2 upgrade
ENC_PREFIX = "enc2:"
LEGACY_PREFIX = "enc1:"
_NONCE_LEN = 16
_TAG_LEN = 32


def new_salt() -> bytes:
    return os.urandom(16)


def derive_key(pin: str, salt: bytes,
               iterations: int = PBKDF2_ITERATIONS) -> bytes:
    return hashlib.pbkdf2_hmac("sha256", pin.encode("utf-8"), salt, iterations)


def verifier(key: bytes) -> str:
    """Stored alongside the salt; lets the app reject a wrong PIN cleanly."""
    return hmac.new(key, b"vault-key-verifier", hashlib.sha256).hexdigest()


def is_encrypted(value: str) -> bool:
    return value.startswith((ENC_PREFIX, LEGACY_PREFIX))


def _subkeys(key: bytes) -> tuple[bytes, bytes]:
    """Independent keys for the keystream PRF and the MAC (v2 scheme)."""
    return (hmac.new(key, b"enc", hashlib.sha256).digest(),
            hmac.new(key, b"mac", hashlib.sha256).digest())


def _keystream(key: bytes, nonce: bytes, length: int) -> bytes:
    out = b""
    counter = 0
    while len(out) < length:
        out += hmac.new(key, nonce + counter.to_bytes(4, "big"),
                        hashlib.sha256).digest()
        counter += 1
    return out[:length]


def encrypt(key: bytes, plaintext: str) -> str:
    enc_key, mac_key = _subkeys(key)
    data = plaintext.encode("utf-8")
    nonce = os.urandom(_NONCE_LEN)
    ct = bytes(a ^ b for a, b in zip(data, _keystream(enc_key, nonce, len(data))))
    tag = hmac.new(mac_key, b"tag" + nonce + ct, hashlib.sha256).digest()
    return ENC_PREFIX + base64.urlsafe_b64encode(nonce + tag + ct).decode("ascii")


def decrypt(key: bytes, token: str) -> str:
    """Raises ValueError on a tampered token or wrong key. Reads both the
    current v2 tokens and legacy v1 tokens (single-key scheme)."""
    if token.startswith(ENC_PREFIX):
        enc_key, mac_key = _subkeys(key)
        body = token[len(ENC_PREFIX):]
    elif token.startswith(LEGACY_PREFIX):
        enc_key = mac_key = bytes(key)
        body = token[len(LEGACY_PREFIX):]
    else:
        raise ValueError("not an encrypted token")
    try:
        raw = base64.urlsafe_b64decode(body.encode("ascii"))
    except Exception as exc:
        raise ValueError("corrupt token") from exc
    if len(raw) < _NONCE_LEN + _TAG_LEN:
        raise ValueError("corrupt token")
    nonce = raw[:_NONCE_LEN]
    tag = raw[_NONCE_LEN:_NONCE_LEN + _TAG_LEN]
    ct = raw[_NONCE_LEN + _TAG_LEN:]
    expect = hmac.new(mac_key, b"tag" + nonce + ct, hashlib.sha256).digest()
    if not hmac.compare_digest(tag, expect):
        raise TamperError("integrity check failed (wrong PIN or tampered data)")
    return bytes(a ^ b for a, b in
                 zip(ct, _keystream(enc_key, nonce, len(ct)))).decode("utf-8")


def wipe(key) -> None:
    """Best-effort zeroization: only works for bytearray keys; Python bytes
    are immutable and copies may persist until GC either way."""
    if isinstance(key, bytearray):
        for i in range(len(key)):
            key[i] = 0


# ---------- UID-keyed layer (always-on vault envelope) ----------
#
# database.py wraps every profile_vault value in this layer, keyed by the
# Supabase user id (JWT "sub", cached in app_settings). It sits BENEATH the
# opt-in PIN vault above: an "enc2:" PIN token is just another opaque string
# to wrap. Two interchangeable formats:
#   "fsec1:" — flet.security (Fernet + PBKDF2-600k, per-message salt);
#              preferred, but flet.security isn't bundled in the Android APK.
#   "uenc1:" — the enc2 construction above, keyed by PBKDF2(uid, vault salt);
#              stdlib fallback that works everywhere.
# Reads dispatch on the prefix, so either environment decrypts its own tokens.

FSEC_PREFIX = "fsec1:"
UENC_PREFIX = "uenc1:"
_uid_key_cache: dict[tuple[str, bytes], bytes] = {}
_flet_security = None      # module once imported; False = import failed


def flet_security_available() -> bool:
    global _flet_security
    if _flet_security is None:
        try:
            import flet.security as fs
            _flet_security = fs
        except Exception:
            _flet_security = False
    return _flet_security is not False


def is_uid_encrypted(value: str) -> bool:
    return value.startswith((FSEC_PREFIX, UENC_PREFIX))


def uid_key(uid: str, salt: bytes) -> bytes:
    """PBKDF2 key for the uenc1 fallback, memoized — the salt is DB-wide so
    this is derived once per process."""
    cached = _uid_key_cache.get((uid, salt))
    if cached is None:
        cached = _uid_key_cache[(uid, salt)] = derive_key(uid, salt)
    return cached


def encrypt_for_uid(uid: str, salt: bytes, plaintext: str) -> str:
    if flet_security_available():
        return FSEC_PREFIX + _flet_security.encrypt(plaintext, uid)
    return UENC_PREFIX + encrypt(uid_key(uid, salt), plaintext)[len(ENC_PREFIX):]


def decrypt_for_uid(uid: str, salt: bytes, token: str) -> str:
    """Raises ValueError on wrong uid, corrupt token, or an fsec1 token in an
    environment without flet.security."""
    if token.startswith(FSEC_PREFIX):
        if not flet_security_available():
            raise ValueError("fsec1 token but flet.security is unavailable")
        try:
            return _flet_security.decrypt(token[len(FSEC_PREFIX):], uid)
        except Exception as exc:
            raise TamperError("integrity check failed (wrong uid or tampered data)") from exc
    if token.startswith(UENC_PREFIX):
        return decrypt(uid_key(uid, salt), ENC_PREFIX + token[len(UENC_PREFIX):])
    raise ValueError("not a uid-encrypted token")

Pure state machine, no Flet imports — app.py owns the UI reaction (wiping the
PIN vault key, showing the lock overlay) via the on_lock callback; tests drive
this class directly with injected clocks and real threads.

Thread-safe: the UI event loop, the idle-watchdog task, and lifecycle events
can all race on lock()/unlock()/touch(), so every transition is a
compare-and-swap under one mutex.
"""
import logging
import threading
import time

log = logging.getLogger("session_guard")

IDLE_TIMEOUT_SECONDS = 120  # 2 minutes without interaction => auto-lock


class SessionGuard:
    def __init__(self, on_lock=None):
        self._mutex = threading.Lock()
        self._locked = False
        self._last_activity = time.monotonic()
        self._on_lock = on_lock  # fired once per False->True flip, outside the mutex

    def touch(self) -> None:
        """Record user interaction. Ignored while locked — activity on the
        lock screen must not silently extend a dead session."""
        with self._mutex:
            if not self._locked:
                self._last_activity = time.monotonic()

    def lock(self, reason: str = "") -> bool:
        """CAS False->True. Returns True only for the thread that performed
        the flip (the on_lock callback fires exactly once per lock cycle)."""
        with self._mutex:
            if self._locked:
                return False
            self._locked = True
        log.info("session locked (%s)", reason or "manual")
        if self._on_lock is not None:
            try:
                self._on_lock(reason)
            except Exception:
                log.exception("on_lock callback failed")
        return True

    def unlock(self) -> bool:
        """CAS True->False after successful re-authentication; resets the
        idle clock. Returns True only for the thread that performed the flip."""
        with self._mutex:
            if not self._locked:
                return False
            self._locked = False
            self._last_activity = time.monotonic()
        log.info("session unlocked")
        return True

    def is_locked(self) -> bool:
        with self._mutex:
            return self._locked

    def idle_expired(self, timeout: float = IDLE_TIMEOUT_SECONDS,
                     now: float | None = None) -> bool:
        """True when the idle window has elapsed. \\\`now\\\` is injectable so
        tests don't have to sleep."""
        if now is None:
            now = time.monotonic()
        with self._mutex:
            return not self._locked and (now - self._last_activity) >= timeout

from playwright.sync_api import TimeoutError as PlaywrightTimeout
from playwright.sync_api import sync_playwright

from config import SEARCH_URL

USER_AGENT = (
    "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "

def _dismiss_login_modal(page) -> None:
    """Best-effort: close the full-screen login overlay so the page settles.
    Extraction reads embedded JSON, so failure here is non-fatal."""
    try:
        close_btn = page.locator('div[aria-label="Close"]').first
        close_btn.click(timeout=5000)
        return
    except PlaywrightTimeout:
        pass
    except Exception:
        pass
    try:
        page.keyboard.press("Escape")
    except Exception:
        pass


# FB embeds listings under either typename depending on page variant.
LISTING_TYPENAMES = {"MarketplaceProductItem", "GroupCommerceProductItem"}


def _walk_for_items(node, found: dict) -> None:
    """Recursively collect listing objects, deduped by id."""
    if isinstance(node, dict):
        if node.get("__typename") in LISTING_TYPENAMES and node.get("id"):
            found.setdefault(str(node["id"]), node)
        for value in node.values():
            _walk_for_items(value, found)
    elif isinstance(node, list):
        for value in node:
            _walk_for_items(value, found)


def _normalize(item: dict) -> dict | None:
    listing_id = str(item.get("id", ""))
    if not listing_id:
        return None
    if item.get("is_sold") or item.get("is_hidden"):
        return None

    price = None
    price_node = item.get("listing_price") or item.get("price") or {}
    if isinstance(price_node, dict):
        amount = price_node.get("amount")
        if amount is not None:
            try:
                price = int(float(amount))
            except (TypeError, ValueError):
                price = None

    title = (
        item.get("marketplace_listing_title")
        or item.get("custom_title")
        or item.get("title")
        or "Untitled"
    )

    location = ""
    loc_node = item.get("location") or {}
    if isinstance(loc_node, dict):
        reverse = loc_node.get("reverse_geocode") or {}
        if isinstance(reverse, dict):
            location = reverse.get("city_page", {}).get("display_name") or reverse.get("city") or ""

    mileage = ""
    for sub in item.get("custom_sub_titles_with_rendering_flags") or []:
        if isinstance(sub, dict) and sub.get("subtitle"):
            mileage = sub["subtitle"]
            break

    return {
        "id": listing_id,
        "title": title,
        "price": price,
        "url": f"https://www.facebook.com/marketplace/item/{listing_id}/",
        "location": location,
        "mileage": mileage,
        "mileage_num": _mileage_to_int(mileage),
    }


def _mileage_to_int(text: str) -> int | None:
    """'132K miles' -> 132000, '98,500 miles' -> 98500; None if unparseable."""
    match = re.search(r"([\\\\d.,]+)\\\\s*([kK])?\\\\s*miles", text)
    if not match:
        return None
    try:
        value = float(match.group(1).replace(",", ""))
    except ValueError:
        return None
    if match.group(2):
        value *= 1000
    return int(value)


def scrape_listings() -> list[dict]:
    """Load SEARCH_URL, dismiss the login overlay, and parse every
    script[type=application/json] tag for MarketplaceProductItem objects."""
    with sync_playwright() as p:
        browser = p.chromium.launch(headless=True)
        context = browser.new_context(user_agent=USER_AGENT, locale="en-US")
        page = context.new_page()
        try:
            page.goto(SEARCH_URL, wait_until="domcontentloaded", timeout=60000)
            page.wait_for_timeout(2000)
            _dismiss_login_modal(page)

            # Scroll to trigger lazy-loaded result batches.
            for _ in range(4):
                page.mouse.wheel(0, 2500)
                page.wait_for_timeout(800)

            raw_blobs = page.locator('script[type="application/json"]').all_text_contents()
        finally:
            browser.close()

    found: dict[str, dict] = {}
    for blob in raw_blobs:
        try:
            data = json.loads(blob)
        except json.JSONDecodeError:
            continue
        _walk_for_items(data, found)

    listings = []
    for item in found.values():
        normalized = _normalize(item)
        if normalized:
            listings.append(normalized)
    return listings

    """One generate_content call, with a single sleep-and-retry on per-minute
    rate limits. A per-day quota hit sets the daily block instead of retrying."""
    global _daily_block_until
    client = _get_client()
    try:
        return client.models.generate_content(model=GEMINI_MODEL, contents=prompt, config=config)
    except errors.APIError as exc:
        if exc.code != 429:
            raise
        if "PerDay" in str(exc):
            _daily_block_until = time.monotonic() + 3600
            print("[notifier] daily Gemini quota exhausted; pausing evaluations for 1h")
            raise
        delay = _retry_delay_from(exc)
        print(f"[notifier] rate limited; retrying in {delay}s")
        time.sleep(delay)
        return client.models.generate_content(model=GEMINI_MODEL, contents=prompt, config=config)


def _parse_verdict(text: str) -> dict | None:
    """Parse the model's JSON, tolerating code fences or surrounding prose."""
    text = text.strip()
    fenced = re.search(r"\\\`\\\`\\\`(?:json)?\\\\s*(\\\\{.*?\\\\})\\\\s*\\\`\\\`\\\`", text, re.DOTALL)
    if fenced:
        text = fenced.group(1)
    elif not text.startswith("{"):
        brace = re.search(r"\\\\{.*\\\\}", text, re.DOTALL)
        if not brace:
            return None
        text = brace.group(0)
    try:
        verdict = json.loads(text)
    except json.JSONDecodeError:
        return None
    if not isinstance(verdict, dict) or "passes_filters" not in verdict:
        return None
    return verdict

    """Score a listing with Gemini + Google Search grounding.
    Returns the verdict dict, or None on any failure (caller retries next cycle)."""
    global _schema_supported
    if time.monotonic() < _daily_block_until:
        return None
    prompt = EVALUATION_PROMPT.format(
        title=listing["title"],
        price=f"\\\${listing['price']:,}" if listing["price"] is not None else "unknown",
        mileage=listing.get("mileage") or "not stated",
        location=listing.get("location") or "unknown",
    )

    response = None
    if _schema_supported:
        try:
            response = _call_gemini(prompt, types.GenerateContentConfig(
                tools=[{"google_search": {}}],
                response_mime_type="application/json",
                response_schema=RESPONSE_SCHEMA,
            ))
        except errors.APIError as exc:
            if exc.code == 400 and "response mime type" in str(exc):
                _schema_supported = False
                print("[notifier] API rejects grounding + JSON schema; "
                      "using prompt-enforced JSON for the rest of this run")
            else:

                return None

            return None

    if response is None:
        try:

    if verdict is None:

def _detect_transmission(listing: dict) -> str | None:
    text = f"{listing['title']} {listing.get('mileage', '')}".lower()
    if "manual" in text or re.search(r"\\\\b[456][\\\\s-]?(speed|spd)\\\\b", text):
        return "Manual"
    if "automatic" in text or re.search(r"\\\\bauto\\\\b", text):
        return "Automatic"
    return None


def _format_alert(listing: dict, verdict: dict, old_price: int | None = None) -> str:
    header = f"[Score: {verdict['score_out_of_10']}/10] {listing['title']}"
    transmission = _detect_transmission(listing)
    if transmission:
        header += f" ({transmission})"

    price = f"\\\${listing['price']:,}" if listing["price"] is not None else "unknown"
    if old_price is not None:
        price += f" (was \\\${old_price:,})"

    horsepower = verdict.get("estimated_horsepower")
    power = f"{horsepower} HP" if horsepower is not None else "unknown"

    return "\\\\n".join([
        f"\\\\U0001F3CE️ *{header}*",
        f"\\\\U0001F4B0 *Price:* {price}",
        f"\\\\U0001F4CD *Miles:* {listing.get('mileage') or 'not stated'}",
        f"\\\\U0001F40E *Est. Power:* {power}",
        "",
        f"\\\\U0001F4DD *Summary:* {verdict.get('short_summary', '')}",
        "",
        f"\\\\U0001F517 [View Listing]({listing['url']})",
    ])


def _send_telegram(text: str) -> None:
    payload = {
        "chat_id": TELEGRAM_CHAT_ID,
        "text": text,
        "parse_mode": "Markdown",
        "disable_web_page_preview": False,
    }
    try:
        resp = requests.post(TELEGRAM_API, json=payload, timeout=15)
        if resp.status_code == 400:
            # Markdown parse failure (odd chars in title) — resend as plain text.
            payload.pop("parse_mode")
            resp = requests.post(TELEGRAM_API, json=payload, timeout=15)
        if not resp.ok:
            print(f"[notifier] Telegram error {resp.status_code}: {resp.text}")
    except requests.RequestException as exc:
        print(f"[notifier] Telegram request failed: {exc}")


def _hard_reject_reason(listing: dict) -> str | None:
    """Local mirror of the absolute evaluation rules. Returns why the listing
    can never pass, or None if it deserves an AI evaluation."""
    price = listing["price"]
    if price is not None and price > AI_PRICE_CEILING:
        return f"price \\\${price:,} over \\\${AI_PRICE_CEILING:,} ceiling"
    if MAX_PRICE and price is not None and price > MAX_PRICE:
        return f"price \\\${price:,} over MAX_PRICE"
    title = listing["title"].lower()
    for word in BODY_BLOCKLIST:
        if re.search(rf"\\\\b{re.escape(word)}\\\\b", title):
            return f"body type '{word}'"
    if _detect_transmission(listing) == "Automatic":
        return "automatic transmission"
    mileage = listing.get("mileage_num")
    if mileage is not None and mileage > MAX_MILEAGE:
        return f"mileage {mileage:,} over {MAX_MILEAGE:,}"
    return None


def process_listings(listings: list[dict], seen: dict) -> dict:
    """Diff scraped listings against seen state; hard-filter obvious rejects
    locally; AI-evaluate surviving new items and price drops; alert on passing
    verdicts scoring >= MIN_SCORE. Returns updated state. Listings whose
    evaluation fails are left out of state so they retry next cycle."""
    updated = dict(seen)
    to_eval = []
    for listing in listings:
        listing_id = listing["id"]
        price = listing["price"]
        is_new = listing_id not in updated

        reason = _hard_reject_reason(listing)
        if reason is not None:
            if is_new:
                print(f"[notifier] SKIP {listing_id}: {listing['title']} ({reason})")
            updated[listing_id] = price
            continue

        old_price = None if is_new else updated[listing_id]
        is_drop = (
            not is_new
            and price is not None
            and old_price is not None
            and price < old_price
        )
        if is_new or is_drop:
            to_eval.append((listing, old_price if is_drop else None, "NEW" if is_new else "DROP"))
        else:
            updated[listing_id] = price

    if not to_eval:
        save_seen(updated)
        return updated

    if time.monotonic() < _daily_block_until:
        remaining = int((_daily_block_until - time.monotonic()) / 60) + 1
        print(f"[notifier] daily quota block active (~{remaining} min left); deferring {len(to_eval)} evals")
        save_seen(updated)
        return updated

    if len(to_eval) > MAX_EVALS_PER_CYCLE:
        print(f"[notifier] deferring {len(to_eval) - MAX_EVALS_PER_CYCLE} evals to next cycle (quota guard)")
        to_eval = to_eval[:MAX_EVALS_PER_CYCLE]

    print(f"[notifier] evaluating {len(to_eval)} listings with {EVAL_WORKERS} workers")
    with ThreadPoolExecutor(max_workers=EVAL_WORKERS) as pool:
        futures = {
            pool.submit(evaluate_listing, listing): (listing, old_price, kind)
            for listing, old_price, kind in to_eval
        }
        try:
            for future in as_completed(futures):
                listing, old_price, kind = futures[future]
                verdict = future.result()
                if verdict is None:
                    continue
                passes = (
                    bool(verdict.get("passes_filters"))
                    and verdict.get("score_out_of_10", 0) >= MIN_SCORE
                )
                print(
                    f"[notifier] {kind} {listing['id']}: {listing['title']} -> "
                    f"score {verdict.get('score_out_of_10')}, passes={verdict.get('passes_filters')}"
                )
                if passes:
                    _send_telegram(_format_alert(listing, verdict, old_price=old_price))
                updated[listing["id"]] = listing["price"]
                # Evaluations are slow; persist after each one so an interrupt
                # mid-cycle doesn't re-evaluate everything next run.
                save_seen(updated)
        except KeyboardInterrupt:
            pool.shutdown(cancel_futures=True)
            raise
    return updated

def calculate_indicators(df):
    """RSI(14), 20-period SMA, Bollinger Bands, and z-score of close vs SMA20."""
    delta = df['close'].diff()
    gain = (delta.where(delta > 0, 0)).rolling(window=14).mean()
    loss = (-delta.where(delta < 0, 0)).rolling(window=14).mean()
    rs = gain / loss
    df['rsi'] = 100 - (100 / (1 + rs))

    df['sma_20'] = df['close'].rolling(window=20).mean()
    df['std_20'] = df['close'].rolling(window=20).std()
    df['upper_bb'] = df['sma_20'] + (2 * df['std_20'])
    df['lower_bb'] = df['sma_20'] - (2 * df['std_20'])

    # How many standard deviations the close sits from its own 20-period mean.
    # This is the actual entry trigger, RSI is a secondary confirmation.
    df['z_score'] = (df['close'] - df['sma_20']) / df['std_20']
    return df

        df_trade = pd.DataFrame(bars_trade, columns=['timestamp', 'open', 'high',
                                                     'low', 'close', 'volume'])

        current_rsi = df_trade.iloc[-1]['rsi']
        sma_20 = df_trade.iloc[-1]['sma_20']

        size = CAPITAL_PER_TRADE / current_price
